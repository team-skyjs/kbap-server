[versions]
java = "21"
kotlin = "2.3.21"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.0"
junit = "5.13.4"
springdoc = "2.8.6"
kotest = "5.9.1"
kotest-extensions-spring = "1.3.0"
jacoco = "0.8.12"
archunit = "1.3.0"
jackson = "2.21.4"
# 인증(KB-118): jjwt·firebase-admin 은 Spring Boot BOM 이 관리하지 않아 버전을 여기에 고정한다.
jjwt = "0.12.6"
firebase-admin = "9.4.3"
# 스토리지(KB-145/KB-138): AWS SDK for Java v2 — Spring Boot BOM 이 관리하지 않아 BOM 을 별도 platform 으로 고정.
# presign(S3Presigner)·head/delete(S3Client) 모두 s3 아티팩트에 포함 — 별도 s3-presigner 의존 불필요.
aws-sdk = "2.48.0"
# 스케줄 중복 실행 방지(KB-226): 운영 api 2대에서 이미지 회수 틱을 1대만 실행 — Spring Boot BOM 미관리.
shedlock = "6.9.2"

[plugins]
# 루트 build.gradle.kts 에서 apply false 로 선언 → 각 모듈/subprojects 에서 적용.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
# --- Kotlin / Jackson ---
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# 벡터 검색(KB-319): DocumentDB(MongoDB 호환) 접근 — 버전은 Spring Boot BOM 이 관리.
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# --- Spring framework (versions managed by the Spring Boot BOM) ---
# application 모듈은 web/jpa 스타터 없이 @Service/@Transactional 만 필요 → 최소 의존만 얹는다.
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

# --- Spring Boot starters (versions managed by the Spring Boot BOM) ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

# --- Databases ---
mysql-connector = { module = "com.mysql:mysql-connector-j" }

# --- JPA/Hibernate 애너테이션 (버전은 Spring Boot BOM 관리) ---
# :core 의 영속 공통(BaseEntity·IdConverter)이 compileOnly 로만 쓴다 — 런타임 제공은 도메인 모듈.
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }

# --- DB migration ---
# Spring Boot 4 는 autoconfig 를 기술별 모듈로 분리 — flyway-core(라이브러리)만으론
# 마이그레이션이 자동 실행되지 않으므로 Boot 의 Flyway autoconfig 모듈을 명시 추가한다.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }

# --- Storage (KB-145/KB-138): S3 presigned URL 발급·오브젝트 검증 (AWS SDK v2) ---
# BOM 으로 버전 정렬 — s3 만 의존(presigner·client 모두 s3 아티팩트에 포함).
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3" }

# --- API docs (Swagger UI) ---
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# --- Scheduler lock (KB-226): 이미지 회수 @Scheduled 를 api 2대 중 1대만 실행 ---
# @SchedulerLock 어노테이션 AOP(shedlock-spring)로 잡는다 — 잡 메서드에 @Scheduled 와 나란히 선언.
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

# --- LLM (Spring AI 2.x, versions managed by the Spring AI BOM) ---
# 채팅·비전은 OpenAI 단일 벤더(KB-320), 임베딩만 Bedrock Titan.
spring-ai-starter-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
spring-ai-starter-bedrock = { module = "org.springframework.ai:spring-ai-starter-model-bedrock" }

# --- Auth (KB-118): 자체 JWT 발급/파싱 + Firebase ID 토큰 검증 ---
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }

# --- Test (versions managed by the Spring Boot / JUnit BOM) ---
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Boot 4.x 는 test-slice 어노테이션을 기술별 모듈로 분리했다(starter-test 가 전이 제공하지 않음).
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotest-extensions-spring" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Testcontainers (versions managed by the Spring Boot BOM). @ServiceConnection 지원은 spring-boot-testcontainers.
# testFixtures 등 dependency-management 가 자동 적용되지 않는 구성엔 아래 BOM 을 platform 으로 직접 얹는다.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Testcontainers 2.0 부터 DB 모듈 좌표가 `mysql` → `testcontainers-mysql` 로 바뀌었다(구 `org.testcontainers:mysql` 은 1.x 까지).
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
# Redis 는 전용 모듈 없이 GenericContainer 로 띄운다(testcontainers 코어).
testcontainers-core = { module = "org.testcontainers:testcontainers" }

# --- Architecture boundary tests (모듈 경계 강제) ---
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
