# 배포용 스택 — 앱 컨테이너 1개(simhani1/kbap-api). DB 는 기존 mysql-prod(monitor-net) 재사용.
#
# - MySQL: 별도로 만들지 않고 외부 네트워크 monitor-net 의 기존 컨테이너 `mysql-prod` 에
#   컨테이너명으로 붙는다(mysql-prod 의 호스트 퍼블리시가 127.0.0.1 전용이라 host-gateway 로는 안 되고,
#   같은 도커 네트워크에 합류해 내부 3306 으로 통신).
# - 프로필 prod: datasource 접속값을 환경변수로만 받는다(아래 .env 필요).
#
# 사용법:
#   # 같은 디렉터리에 .env 로 DB 자격증명 제공(아래 필수 키)
#   docker compose -f docker-compose.prod.yml pull      # 최신 이미지 받기
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f app
#
# 필수 .env 키:
#   DB_NAME=kbap            # mysql-prod 안의 DB 이름(없으면 미리 생성)
#   DB_USERNAME=kbap        # mysql-prod 에 존재하고 컨테이너 네트워크(%)에서 접속 가능한 계정
#   DB_PASSWORD=********
#   OPENAI_API_KEY=sk-****   # 스캔 vision(gpt-5.6-luna) + 음식 이미지 생성. 없으면 앱이 부팅하지 않는다.
#   CDN_BASE_URL=https://... # vision 모델이 사진을 fetch 할 도메인. 없으면 스캔이 실패한다.
#   JWT_SECRET=********      # 자체 JWT HS256 서명 키(32바이트 이상). 없으면 앱이 부팅하지 않는다. (KB-118)
#   FIREBASE_CREDENTIALS_JSON=<base64>  # 서비스 계정 키 내용. 없으면 부팅은 되고 로그인만 401. (KB-118)
services:
  app:
    image: simhani1/kbap-api:latest
    container_name: kbap-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # monitor-net 안에서 컨테이너명으로 직접 접속(호스트 포트 매핑 무관).
      DB_URL: jdbc:mysql://mysql-prod:3306/${DB_NAME:-kbap}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 전 LLM 단일 벤더(KB-320) — 스캔 vision(gpt-5.6-luna)과 음식 이미지 생성이 같은 키를 쓴다.
      # vision 없이 스캔 API 를 열지 않으므로 키가 없으면 앱이 부팅에서 실패한다(의도된 fail-fast).
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 를 .env 에 설정하세요}
      # vision 모델이 오브젝트 path 앞에 붙여 사진을 직접 fetch 할 CDN 도메인.
      CDN_BASE_URL: ${CDN_BASE_URL:?CDN_BASE_URL 을 .env 에 설정하세요}
      # 인증(KB-118): 자체 JWT 서명 키 + Firebase 서비스 계정(내용 base64) + refresh 세션 저장소(Redis).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 설정하세요 (32바이트 이상)}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - monitor-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: kbap-redis-prod
    # refresh token 세션 저장소(KB-118). TTL 로 만료가 자동 처리되고 유실 시 사용자 재로그인으로
    # 복구되는 데이터라 영속 볼륨을 두지 않는다. 호스트 포트도 열지 않는다(앱 컨테이너 내부 통신 전용).
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # 기존 mysql-prod 가 붙어 있는 외부 네트워크(미리 존재해야 함: docker network ls 로 확인).
  monitor-net:
    external: true
    name: monitor-net
