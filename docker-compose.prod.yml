# 배포용 스택 — 앱 컨테이너 1개(simhani1/meogo-api). DB 는 기존 mysql-prod(monitor-net) 재사용, MongoDB 미사용.
#
# - MySQL: 별도로 만들지 않고 외부 네트워크 monitor-net 의 기존 컨테이너 `mysql-prod` 에
#   컨테이너명으로 붙는다(mysql-prod 의 호스트 퍼블리시가 127.0.0.1 전용이라 host-gateway 로는 안 되고,
#   같은 도커 네트워크에 합류해 내부 3306 으로 통신).
# - MongoDB: 사용하지 않는다. data-mongodb 스타터가 이미지에 들어 있지만 소스에서 안 쓰므로,
#   Mongo 자동설정·헬스체크를 SPRING_AUTOCONFIGURE_EXCLUDE 로 로드 차단한다(이미지 재빌드 불필요).
#   → MONGODB_URI 없이도 부팅되고, 헬스체크가 Mongo 로 DOWN 되지 않는다.
# - 프로필 prod: datasource 접속값을 환경변수로만 받는다(아래 .env 필요).
#
# 사용법:
#   # 같은 디렉터리에 .env 로 DB 자격증명 제공(아래 필수 키)
#   docker compose -f docker-compose.prod.yml pull      # 최신 이미지 받기
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f app
#
# 필수 .env 키:
#   DB_NAME=meogo            # mysql-prod 안의 DB 이름(없으면 미리 생성)
#   DB_USERNAME=meogo        # mysql-prod 에 존재하고 컨테이너 네트워크(%)에서 접속 가능한 계정
#   DB_PASSWORD=********
#   UPSTAGE_API_KEY=up_****  # 메뉴 스캔 정제(solar-pro). 없으면 앱이 부팅하지 않는다.
services:
  app:
    image: simhani1/meogo-api:latest
    container_name: meogo-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # monitor-net 안에서 컨테이너명으로 직접 접속(호스트 포트 매핑 무관).
      DB_URL: jdbc:mysql://mysql-prod:3306/${DB_NAME:-meogo}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 메뉴 스캔 메뉴명 정제(Upstage solar-pro). 정제 없이 스캔 API 를 열지 않으므로
      # 키가 없으면 앱이 부팅에서 실패한다(의도된 fail-fast).
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:?UPSTAGE_API_KEY 를 .env 에 설정하세요}
      # MongoDB 미사용 — 클라이언트/데이터/헬스/메트릭 자동설정 로드 차단(Boot 4.1 FQN).
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration"
    networks:
      - monitor-net
    restart: unless-stopped

networks:
  # 기존 mysql-prod 가 붙어 있는 외부 네트워크(미리 존재해야 함: docker network ls 로 확인).
  monitor-net:
    external: true
    name: monitor-net
