spring:
  # 루트의 .env 를 properties 형식으로 읽어 ${...} 플레이스홀더에 사용한다(없으면 조용히 건너뜀).
  config:
    import: optional:file:.env[.properties]
  application:
    name: meogo-batch
# 배치는 meogo-api 내부 모듈에 의존하지 않는 디커플드 위성 앱이다 —
# ORM/JPA·Spring AI·Flyway 자동구성이 클래스패스에 없어 관련 설정이 필요 없다.
# meogo-api 와의 연동은 :meogo-common 의 통합 이벤트(브로커)로만 한다.
# datasource·메시징 등 실제 배치 잡 설정은 잡 도입 시 프로필별로 추가한다.
