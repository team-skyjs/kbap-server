spring:
  application:
    name: meogo-batch
  # :infra:llm 이 Spring AI 스타터(openai·google-genai)를 배치 런타임/테스트 클래스패스로 전이시킨다.
  # 키 없이 컨텍스트를 로딩해도 벤더 자동구성이 뜨지 않도록 모든 모델 자동구성을 명시 비활성한다
  # (LLM 빈은 :infra:llm 의 meogo.llm.* + @ConditionalOnProperty 로만 구성 — 키 없으면 빈 미생성).
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
  # 승격 배치 e2e(@SpringBootTest)는 MySQL Testcontainers 에 붙는다. 배치엔 마이그레이션이 없으므로
  # 스키마는 Hibernate 가 엔티티에서 생성한다(infra:persistence 테스트와 동일 전략, KB-46 D-3).
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: create
