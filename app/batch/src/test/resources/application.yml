spring:
  application:
    name: kbap-batch
  # 부팅 검증만 — 잡은 자동 실행하지 않는다. 테스트는 Flyway off 라 Batch 메타 테이블을
  # Spring Batch 자체 initializer 가 Testcontainer 에 생성한다(운영은 api Flyway 소유).
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  # :infra:llm 이 Spring AI 스타터(openai·google-genai)를 배치 런타임/테스트 클래스패스로 전이시킨다.
  # 키 없이 컨텍스트를 로딩해도 벤더 자동구성이 뜨지 않도록 모든 모델 자동구성을 명시 비활성한다
  # (LLM 빈은 :infra:llm 의 kbap.llm.* + @ConditionalOnProperty 로만 구성 — 키 없으면 빈 미생성).
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
