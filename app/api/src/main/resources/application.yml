server:
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰한다.
  # 프록시가 TLS 를 종료(https)하고 평문 http 로 넘겨도 앱이 원래 스킴/호스트를 인식해
  # Swagger UI 등 자기 참조 URL 을 https 로 생성한다(mixed content 방지).
  forward-headers-strategy: framework

spring:
  # 루트의 .env 를 properties 형식으로 읽어 ${...} 플레이스홀더에 사용한다.
  # optional: → .env 가 없으면(예: 배포 환경) 조용히 건너뛰고 OS 환경변수를 쓴다.
  # (.env 를 루트에서 찾도록 meogo-api 의 bootRun workingDir 를 루트로 설정해 둠)
  config:
    import: optional:file:.env[.properties]
  application:
    name: meogo-api
  flyway:
    # 신규 마이그레이션 버전은 생성 시각 기반 점 구분 timestamp(Vyyyy.MM.dd.HH.mm.ss)라,
    # 먼저 만들고 늦게 머지된 마이그레이션이 이미 적용된 최신보다 과거 버전이 될 수 있다.
    # 이를 validate 실패(부팅 거부)가 아니라 정상 적용(out-of-order)으로 허용한다.
    # 전제: 각 마이그레이션은 실행 순서에 의존하지 않게 독립적으로 작성한다. (KB-44)
    out-of-order: true
  # 활성 프로필은 런타임에 지정한다 (예: SPRING_PROFILES_ACTIVE=local|dev|staging|prod).
  # 여기서 기본 프로필이나 datasource 를 강제하지 않으므로, 프로필 없이 뜨는
  # 테스트(@SpringBootTest)는 임베디드 H2 로 동작한다.
  ai:
    model:
      # LLM 모델은 구현 시 빈으로 명시 구성한다(OpenAI/Upstage/Gemini 병렬 호출).
      # 키 없이 자동구성이 떠서 부팅이 실패하지 않도록 기본은 모두 비활성으로 둔다.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
