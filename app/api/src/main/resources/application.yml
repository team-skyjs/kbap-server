logging:
  # Boot 기본 콘솔 패턴의 correlation 자리에 삽입된다 — logback-spring.xml 수정 없이
  # 전 로그 라인에 요청 상관 키·회원 식별자가 붙는다(값이 없으면 빈 칸). (KB-130)
  pattern:
    correlation: "[reqId=%X{requestId:-}][memberId=%X{memberId:-}] "

server:
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰한다.
  # 프록시가 TLS 를 종료(https)하고 평문 http 로 넘겨도 앱이 원래 스킴/호스트를 인식해
  # Swagger UI 등 자기 참조 URL 을 https 로 생성한다(mixed content 방지).
  forward-headers-strategy: framework

spring:
  # 루트의 .env 를 properties 형식으로 읽어 ${...} 플레이스홀더에 사용한다.
  # optional: → .env 가 없으면(예: 배포 환경) 조용히 건너뛰고 OS 환경변수를 쓴다.
  # (.env 를 루트에서 찾도록 kbap-api 의 bootRun workingDir 를 루트로 설정해 둠)
  config:
    import: optional:file:.env[.properties]
  application:
    name: kbap-api
  flyway:
    # 신규 마이그레이션 버전은 생성 시각 기반 점 구분 timestamp(Vyyyy.MM.dd.HH.mm.ss)라,
    # 먼저 만들고 늦게 머지된 마이그레이션이 이미 적용된 최신보다 과거 버전이 될 수 있다.
    # 이를 validate 실패(부팅 거부)가 아니라 정상 적용(out-of-order)으로 허용한다.
    # 전제: 각 마이그레이션은 실행 순서에 의존하지 않게 독립적으로 작성한다. (KB-44)
    out-of-order: true
  # 활성 프로필은 런타임에 지정한다 (예: SPRING_PROFILES_ACTIVE=local|dev|staging|prod).
  # 여기서 기본 프로필이나 datasource 를 강제하지 않으므로, 프로필 없이 뜨는
  # 테스트(@SpringBootTest)는 임베디드 H2 로 동작한다.
  ai:
    model:
      # LLM 모델은 구현 시 빈으로 명시 구성한다(OpenAI/Upstage/Gemini 병렬 호출).
      # 키 없이 자동구성이 떠서 부팅이 실패하지 않도록 기본은 모두 비활성으로 둔다.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

kbap:
  auth:
    firebase:
      # 서비스 계정 키를 주는 방법은 두 가지이며 json 이 우선한다.
      #  1) credentials-json — 키 파일 내용(base64 권장). 파일을 두지 않아도 되므로 머신·컨테이너·CI 어디서나 동일하다.
      #  2) credentials-path — 키 파일 경로. 파일 마운트를 쓰는 배포 환경용.
      # 둘 다 없으면 항상 거절하는 폴백 검증기가 등록되어 부팅은 정상이고 /api/v1/auth/login 만 401 이다.
      # 키는 저장소에 커밋하지 않는다 — 주입 경로는 .env.example / specs/kb-118-firebase-jwt-auth/quickstart.md.
      credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    jwt:
      # HS256 서명 키. 32바이트 이상(HMAC-SHA256 최소 길이) — 미설정 시 부팅 실패로 조용한 약한 키를 막는다.
      secret: ${JWT_SECRET:}
      # access 는 stateless 라 만료 전 무효화가 불가능하므로 짧게, refresh 는 Redis 폐기가 가능하므로 길게.
      access-ttl: 30m
      refresh-ttl: 14d
  llm:
    # 스캔 메뉴명 정제(ScannedNameInterpreter)는 Upstage Solar 를 단일 호출한다.
    # 정제 없이 스캔 API 를 열어 두지 않으므로 기본 on — enabled=false 면 SubmitMenuScanUseCase 가
    # 의존성을 못 찾아 부팅에 실패한다. 폴백(degraded=true)은 "호출 실패"에만 쓴다.
    # UPSTAGE_API_KEY 가 없으면 부팅 시 어느 키가 빠졌는지 알려주며 실패한다.
    upstage:
      enabled: ${UPSTAGE_ENABLED:true}
      model: solar-pro
      api-key: ${UPSTAGE_API_KEY:}
      # 정제는 결정적이어야 한다 — 같은 메뉴판에 같은 판정.
      temperature: 0.0
      # 정제 응답은 문자열 JSON 배열 하나 — 스캔 항목(최대 100)에 넉넉한 상한.
      max-output-tokens: 2048
      # 스캔은 동기 응답이라 재시도로 대기시간을 늘릴 수 없다. call-timeout 이 곧 상한이 되도록 0.
      # (Spring AI 기본값 3 이면 최악 4회 시도 = call-timeout x4)
      max-retries: 0
      pricing:
        # Upstage 는 input/output 구분 없는 단일가($0.15/1M)
        input-usd-per-million-tokens: 0.15
        output-usd-per-million-tokens: 0.15
    # 메뉴판 사진 스캔(KB-138)은 gpt-4o-mini vision 을 단일 호출한다. ScanService 가 이 빈에 의존하므로
    # 기본 on — enabled=false 면 부팅에 실패한다. VISION_API_KEY 가 없으면 부팅 시 알려주며 실패한다.
    # image-base-url(CDN 도메인)에 오브젝트 path 를 붙여 모델이 fetch 할 전체 URL 을 만든다(DB 엔 path 만 저장).
    vision:
      enabled: ${VISION_ENABLED:true}
      api-key: ${VISION_API_KEY:}
      model: gpt-4o-mini
      image-base-url: ${CDN_BASE_URL:}
      temperature: 0.0
      max-retries: 0
    # 음식 이미지 배치 생성(KB-226): OpenAI Batch API 일괄 제출 + 1시간 폴링 회수. 빈 조립은 무조건이고
    # 키 검증은 첫 호출 시점 — 키 없이는 관리자 제출·회수만 실패하고 부팅은 성공한다.
    # pricing 은 Batch 단가(동기 대비 50% 할인가)를 넣는다 — 회수 시 장당 llm_call_cost 1행 기록.
    image:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-image-2
      size: 1024x1024
      quality: medium
      pricing:
        input-usd-per-million-tokens: 2.5
        output-usd-per-million-tokens: 20.0
    # 모델 1회 호출 타임아웃. OpenAI 호환 클라이언트(okhttp)의 요청 타임아웃으로 실린다.
    # 스캔 정제는 사용자 요청 경로라 초과 시 폴백(degraded=true)으로 흘린다.
    call-timeout: 5s
  # 이미지 배치 운영 파라미터(KB-226). 배치당 10건 — 부분 회수가 빠르고 소량 신메뉴 운영에 자연스럽다.
  # 프롬프트는 설정이 아니라 코드 상수(FoodImageProperties.PROMPT_TEMPLATE) — 변경 시 PROMPT_VERSION 도 함께 올린다.
  food-image:
    batch-size: 10
    # 정시 cron — 전 인스턴스가 같은 순간 깨어나 ShedLock 이 1대만 고른다(시간당 정확히 1회).
    collect-cron: 0 0 * * * *
  # 이미지 스토리지 S3(KB-138 완료검증 head/delete + KB-145 presigned 발급). enabled=true 프로파일에서만
  # 실 S3 빈(StorageObjectStore·PresignedUploadPort)을 조립한다 — 기본 on, 자격증명은 DefaultCredentialsProvider.
  # public-base-url 은 저장·표시용 공개(CDN) 베이스(presigned 발급 응답의 publicUrl).
  storage:
    enabled: ${STORAGE_ENABLED:true}
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:ap-northeast-2}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
    # 공유 버킷 환경별 폴더 접두 — 업로드 API 발급 키에만 적용, 음식 사진(images/menus)은 환경 공용이라 무접두(KB-171).
    key-prefix: ${STORAGE_KEY_PREFIX:local}
  upload:
    # presigned 발급 정책 — 허용 이미지 형식·크기 상한(bytes)·업로드 URL 만료(KB-145).
    allowed-content-types: image/jpeg,image/png,image/webp
    max-bytes: 10485760
    upload-ttl: 5m
