spring:
  # 데모 음식 시드(db/seed)까지 적용 — prod 는 베이스 locations(db/migration만)를 쓴다. (KB-163)
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

kbap:
  storage:
    # 실 S3 버킷·공개(CDN) 베이스. bucket 이 있어야 실 발급 어댑터가 조립된다(KB-145).
    bucket: ${STORAGE_BUCKET}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL}
