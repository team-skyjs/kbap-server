spring:
  # 로컬은 환경변수로 덮어쓸 수 있게 하되, 없으면 localhost 기본값으로 바로 뜬다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kbap}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # 로컬 docker Redis 는 평문 — TLS 로 검증하려면 REDIS_SSL_ENABLED=true (KB-169)
        enabled: ${REDIS_SSL_ENABLED:false}
