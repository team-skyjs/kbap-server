spring:
  # 데모 음식 시드(db/seed)까지 적용 — prod 는 베이스 locations(db/migration만)를 쓴다. (KB-163)
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  # 로컬은 환경변수로 덮어쓸 수 있게 하되, 없으면 localhost 기본값으로 바로 뜬다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kbap}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
