logging:
  # 수집기가 requestId·memberId·status·elapsedMs 를 필드 단위로 검색할 수 있게 JSON 으로 출력한다.
  # Boot 내장 structured logging — MDC 값이 최상위 필드로 자동 포함된다. (KB-130)
  structured:
    format:
      console: ecs

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

kbap:
  member:
    # 프로필 사진 URL 허용 호스트(콤마 구분, CloudFront CDN 도메인). 비우면 https 형식 검증만 적용된다.
    profile-image-allowed-hosts: ${PROFILE_IMAGE_ALLOWED_HOSTS:}
  storage:
    # 실 S3 버킷·공개(CDN) 베이스. bucket 이 있어야 실 발급 어댑터가 조립된다(KB-145).
    bucket: ${STORAGE_BUCKET}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL}
