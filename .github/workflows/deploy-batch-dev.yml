name: Deploy batch dev

# develop 머지 시 배치 관련 경로에 변경이 있으면 dev 배치 이미지를 갱신한다.
# dev 는 ECS 가 아니라 EC2+SSM 방식(api 와 동일 환경)이므로 여기서는 ECR 푸시까지만 한다 —
# 실행은 run-batch.yml(dev)이 SSM 으로 dev EC2 에서 일회성 docker run 을 기동한다.
# 공유 모듈(core·domain·infra)만 바뀐 경우는 잡히지 않으므로 필요 시 수동 실행(workflow_dispatch)한다.
on:
  push:
    branches: [ "develop" ]
    paths:
      - "batch/**"
      - "Dockerfile.batch"
      - ".github/workflows/deploy-batch-dev.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "batch-latest 로 재지정할 기존 이미지 태그(batch-<sha>). 비우면 현재 커밋을 빌드한다."
        required: false
        type: string

concurrency:
  group: deploy-batch-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and push batch image (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BATCH_REPOSITORY || vars.ECR_REPOSITORY }}"
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 롤백 입력은 ECR 태그 형식만 허용 — 셸 인젝션·잘못된 태그 차단
            case "$IMAGE_TAG_INPUT" in
              [A-Za-z0-9_]*) ;;
              *) echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1 ;;
            esac
            if printf '%s' "$IMAGE_TAG_INPUT" | grep -q '[^A-Za-z0-9._-]'; then
              echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
            fi
            TAG="$IMAGE_TAG_INPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            TAG="batch-$COMMIT_SHA"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "uri=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push batch image
        if: steps.image.outputs.build == 'true'
        run: |
          docker build --platform linux/amd64 -f Dockerfile.batch \
            -t "${{ steps.image.outputs.uri }}" .
          docker push "${{ steps.image.outputs.uri }}"

      # run-batch.yml(dev)이 항상 최신 dev 이미지를 집도록 이동 태그를 함께 유지한다.
      # 롤백은 image_tag 입력으로 과거 sha 태그를 batch-latest 에 재지정하는 방식.
      - name: Point batch-latest to this image
        run: |
          docker pull "${{ steps.image.outputs.uri }}"
          docker tag "${{ steps.image.outputs.uri }}" "${{ steps.image.outputs.repo }}:batch-latest"
          docker push "${{ steps.image.outputs.repo }}:batch-latest"
