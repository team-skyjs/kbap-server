name: Release notes

# dev/prod 배포 워크플로가 호출하는 재사용 워크플로(KB-266).
# release: 배포 커밋의 OpenAPI 스냅샷을 CI 에서 생성(OpenApiSnapshotTest — 배포 서버 미의존,
#   prod "배포 시작까지만 성공" 의미와 무충돌) → 같은 환경 직전 릴리즈 asset 과 oasdiff 비교
#   → GitHub Release 멱등 발행(태그 <env>-YYYYMMDD-<short-sha>, 본문 자동 생성, asset 첨부).
# notify: 슬랙 Incoming Webhook 요약 발송. 릴리즈·슬랙 실패는 배포 성공/실패 판정에 영향 없음.
on:
  workflow_call:
    inputs:
      environment:
        description: "dev | prod — 태그 접두어·문구 결정"
        required: true
        type: string
      prerelease:
        description: "dev=true(프리릴리즈), prod=false(정식)"
        required: true
        type: boolean
      sha:
        description: "배포 커밋 SHA(태그 target·스냅샷 체크아웃 기준)"
        required: true
        type: string
      redeploy:
        description: "기존 이미지 재배포 여부 — true 면 릴리즈를 만들지 않는다(코드 불변)"
        required: true
        type: boolean
      deploy_result:
        description: "호출측 deploy 잡 결과(success/failure)"
        required: true
        type: string
    secrets:
      SLACK_RELEASE_WEBHOOK_URL:
        required: true

env:
  # oasdiff 버전 갱신은 이 값만 수정한다(체크섬은 같은 릴리즈의 checksums.txt 로 검증).
  OASDIFF_VERSION: "1.26.1"

jobs:
  release:
    name: publish github release (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: inputs.deploy_result == 'success' && inputs.redeploy == false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      url: ${{ steps.publish.outputs.url }}
      initial: ${{ steps.baseline.outputs.initial }}
      added: ${{ steps.diff.outputs.added }}
      changed: ${{ steps.diff.outputs.changed }}
      deleted: ${{ steps.diff.outputs.deleted }}
      breaking: ${{ steps.diff.outputs.breaking }}
      endpoints: ${{ steps.diff.outputs.endpoints }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate OpenAPI snapshot for deployed commit
        run: |
          chmod +x gradlew
          ./gradlew :api:test --tests '*OpenApiSnapshotTest*'
          # servers 등 환경 종속 필드는 diff 노이즈라 제거한다(baseline 도 같은 정규화본으로 저장됨).
          jq 'del(.servers)' api/build/openapi.json > openapi.json
          jq -e '.paths | length > 0' openapi.json >/dev/null

      - name: Download baseline from previous release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          PREV_TAG=$(gh release list --limit 100 --exclude-drafts --json tagName \
            --jq "[.[].tagName | select(startswith(\"$ENVIRONMENT-\"))][0] // empty")
          if [ -z "$PREV_TAG" ]; then
            echo "initial=true" >> "$GITHUB_OUTPUT"
            echo "이전 $ENVIRONMENT 릴리즈 없음 — 초기 스냅샷 모드" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release download "$PREV_TAG" --pattern openapi.json --output baseline.json
            echo "initial=false" >> "$GITHUB_OUTPUT"
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Diff with oasdiff
        id: diff
        if: steps.baseline.outputs.initial == 'false'
        run: |
          TARBALL="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sfL -O "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${TARBALL}"
          curl -sfL -O "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/checksums.txt"
          grep "$TARBALL" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" oasdiff

          ./oasdiff changelog baseline.json openapi.json --format markdown > openapi-diff.md || true
          [ -s openapi-diff.md ] || echo "API 변경 없음" > openapi-diff.md
          ./oasdiff diff baseline.json openapi.json --format json > diff.json || echo '{}' > diff.json

          ADDED=$(jq '(.paths.added // []) | length' diff.json)
          DELETED=$(jq '(.paths.deleted // []) | length' diff.json)
          CHANGED=$(jq '(.paths.modified // {}) | length' diff.json)
          BREAKING=$(./oasdiff breaking baseline.json openapi.json --format json 2>/dev/null | jq 'length' || echo 0)
          {
            echo "added=$ADDED"
            echo "deleted=$DELETED"
            echo "changed=$CHANGED"
            echo "breaking=$BREAKING"
          } >> "$GITHUB_OUTPUT"

          {
            echo "endpoints<<ENDPOINTS_EOF"
            {
              jq -r '(.paths.added // [])[] | "• 추가 \(.)"' diff.json
              jq -r '(.paths.modified // {}) | keys[] | "• 변경 \(.)"' diff.json
              jq -r '(.paths.deleted // [])[] | "• 삭제 \(.)"' diff.json
            } | head -10
            TOTAL=$((ADDED + DELETED + CHANGED))
            [ "$TOTAL" -gt 10 ] && echo "외 $((TOTAL - 10))건 — 상세는 Release 첨부"
            echo "ENDPOINTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release (idempotent)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          INITIAL: ${{ steps.baseline.outputs.initial }}
          PREV_TAG: ${{ steps.baseline.outputs.prev_tag }}
        run: |
          SHORT_SHA="${SHA::7}"
          DATE_TAG=$(TZ=Asia/Seoul date +%Y%m%d)
          DATE_TITLE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          TAG="$ENVIRONMENT-$DATE_TAG-$SHORT_SHA"
          TITLE="$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]') · $DATE_TITLE · $SHORT_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 이미 존재 — 재실행 멱등 skip" >> "$GITHUB_STEP_SUMMARY"
            gh release view "$TAG" --json url --jq '"url=\(.url)"' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES=""
          if [ "$ENVIRONMENT" = "prod" ]; then
            NOTES="> 이 릴리즈는 블루/그린 **배포 시작** 확인 시점 기준이다 — 이후 카나리·bake·롤백 판정은 ECS 소관(KB-242)."$'\n\n'
          fi
          if [ "$INITIAL" = "true" ]; then
            NOTES="${NOTES}**초기 OpenAPI 스냅샷** — 비교 기준 없음(다음 배포부터 diff 제공)."$'\n'
          fi

          ARGS=(--target "$SHA" --title "$TITLE" --generate-notes)
          [ -n "$NOTES" ] && ARGS+=(--notes "$NOTES")
          [ -n "$PREV_TAG" ] && ARGS+=(--notes-start-tag "$PREV_TAG")
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)

          ASSETS=(openapi.json)
          [ -f openapi-diff.md ] && ASSETS+=(openapi-diff.md)

          URL=$(gh release create "$TAG" "${ARGS[@]}" "${ASSETS[@]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "release 발행: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure cause
        if: failure()
        run: echo "릴리즈 발행 실패 — 위 스텝 로그 확인(배포 결과에는 영향 없음)" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: slack notify (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Compose and send slack message
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          REDEPLOY: ${{ inputs.redeploy }}
          RELEASE_RESULT: ${{ needs.release.result }}
          SHA: ${{ inputs.sha }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          INITIAL: ${{ needs.release.outputs.initial }}
          ADDED: ${{ needs.release.outputs.added }}
          CHANGED: ${{ needs.release.outputs.changed }}
          DELETED: ${{ needs.release.outputs.deleted }}
          BREAKING: ${{ needs.release.outputs.breaking }}
          ENDPOINTS: ${{ needs.release.outputs.endpoints }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA::7}"
          ENV_LABEL="[$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')]"
          DATE_TITLE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ "$ENVIRONMENT" = "prod" ]; then
            SUCCESS_PHRASE="블루/그린 배포 시작 🚀 (성패 판정은 ECS 소관)"
          else
            SUCCESS_PHRASE="배포 완료 ✅"
          fi

          if [ "$DEPLOY_RESULT" != "success" ]; then
            TEXT="$ENV_LABEL 배포 실패 ❌ · $SHORT_SHA"$'\n'"실행: $RUN_URL"
          elif [ "$REDEPLOY" = "true" ]; then
            TEXT="$ENV_LABEL 재배포 · $SHORT_SHA — 기존 이미지 재기동 ♻️ (코드 변경 없음, 릴리즈 미생성)"
          elif [ "$RELEASE_RESULT" != "success" ]; then
            TEXT="$ENV_LABEL $SUCCESS_PHRASE · 릴리즈 노트 생성 실패 ⚠️ — 원인: actions summary 확인"$'\n'"실행: $RUN_URL"
          else
            if [ "$INITIAL" = "true" ]; then
              SUMMARY="초기 OpenAPI 스냅샷 — 비교 기준 없음(다음 배포부터 diff 제공)"
            elif [ "$((ADDED + CHANGED + DELETED))" -eq 0 ] 2>/dev/null; then
              SUMMARY="API 변경 없음"
            else
              BREAKING_LABEL="$BREAKING"
              [ "$BREAKING" = "0" ] && BREAKING_LABEL="없음"
              SUMMARY="API 추가: $ADDED · 변경: $CHANGED · 삭제: $DELETED · Breaking: $BREAKING_LABEL"$'\n'"$ENDPOINTS"
            fi
            TEXT="$ENV_LABEL $DATE_TITLE · $SHORT_SHA — $SUCCESS_PHRASE"$'\n\n'"$SUMMARY"$'\n\n'"Release: $RELEASE_URL"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"

      - name: Record failure cause
        if: failure()
        run: echo "슬랙 발송 실패 — 웹훅 시크릿·채널 설정 확인(배포·릴리즈 결과에는 영향 없음)" >> "$GITHUB_STEP_SUMMARY"
