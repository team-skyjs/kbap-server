name: Deploy batch prod

# main 머지 시 prod ECS batch 서비스의 태스크정의를 갱신한다.
# prod batch 는 현재 desired_count 0(미기동) — 리비전만 갱신해 두고, 켜는 시점(desired 1)은
# 인프라(Terraform batch_desired_count) 소관이다. desired 0 이면 update-service 는 태스크를 띄우지 않는다.
on:
  push:
    branches: [ "main" ]
    paths:
      - "batch/**"
      - "common/**"
      - "Dockerfile.batch"
      - ".github/workflows/deploy-batch-prod.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 이미지 태그(batch-<sha>). 비우면 현재 커밋을 빌드한다."
        required: false
        type: string

concurrency:
  group: deploy-batch-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and roll batch service (prod)
    runs-on: ubuntu-latest
    environment: prod
    env:
      ECS_NAME: kbap-prod-ecs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BATCH_REPOSITORY || vars.ECR_REPOSITORY }}"
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 롤백 입력은 ECR 태그 형식만 허용 — 셸 인젝션·잘못된 태그 차단
            case "$IMAGE_TAG_INPUT" in
              [A-Za-z0-9_]*) ;;
              *) echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1 ;;
            esac
            if printf '%s' "$IMAGE_TAG_INPUT" | grep -q '[^A-Za-z0-9._-]'; then
              echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
            fi
            TAG="$IMAGE_TAG_INPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            TAG="batch-$COMMIT_SHA"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "uri=$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push batch image
        if: steps.image.outputs.build == 'true'
        run: |
          docker build --platform linux/amd64 -f Dockerfile.batch \
            -t "${{ steps.image.outputs.uri }}" .
          docker push "${{ steps.image.outputs.uri }}"

      # 태스크정의 원본은 Terraform 소유 — 최신 리비전 복제 후 이미지만 교체(api 배포와 동일 패턴).
      - name: Register task definition and roll the service
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_NAME-batch" \
            --query taskDefinition > taskdef.json
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions |= map(if .name == "batch" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' taskdef.json > new-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "registered: $NEW_ARN"
          # 성공 기준은 "롤링 시작"까지(KB-242 판정 기준과 동일) — 완료를 기다리지 않는다.
          # 기동 실패·헬스체크 탈락은 서킷브레이커가 롤백하며, 결과는 ECS 콘솔로 확인한다.
          aws ecs update-service --cluster "$ECS_NAME-cluster" --service "$ECS_NAME-batch" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "rolling started: $NEW_ARN" >> "$GITHUB_STEP_SUMMARY"
