name: Run batch prod

# 음식 콘텐츠 배치(foodContentJob)를 시간별로 ECS run-task 로 기동한다.
# schedule 은 기본 브랜치(main)에 이 파일이 있어야 동작한다.
on:
  schedule:
    # 정시(:00)는 GitHub cron 혼잡으로 지연·누락이 잦아 17분으로 비껴 둔다.
    - cron: "17 * * * *"
  workflow_dispatch:

# 같은 워크플로우가 겹쳐 돌지 않게 직렬화. 태스크 수준 중복은 아래 running check 가 막는다.
concurrency:
  group: run-batch-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: run foodContentJob task
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 이전 실행이 아직 돌고 있으면 이번 회차는 건너뛴다 — RunIdIncrementer 는 매 실행을
      # 새 잡 인스턴스로 만들 뿐 동시 실행을 막아주지 않으므로 기동 측에서 직렬화한다.
      - name: Skip if previous task still running
        id: dedup
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          FAMILY: ${{ vars.ECS_BATCH_TASK_FAMILY }}
        run: |
          RUNNING=$(aws ecs list-tasks --cluster "$CLUSTER" --family "$FAMILY" \
            --desired-status RUNNING --query 'length(taskArns)' --output text)
          if [ "$RUNNING" != "0" ]; then
            echo "previous batch task still running ($RUNNING) — skipping this cycle"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run task
        id: run
        if: steps.dedup.outputs.skip == 'false'
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          FAMILY: ${{ vars.ECS_BATCH_TASK_FAMILY }}
          SUBNETS: ${{ vars.BATCH_SUBNETS }}
          SECURITY_GROUPS: ${{ vars.BATCH_SECURITY_GROUPS }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --started-by "github-actions/${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "run-task 가 태스크를 기동하지 못했습니다(capacity/네트워크 구성 확인)" >&2
            exit 1
          fi
          echo "started: $TASK_ARN"
          echo "arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      # `aws ecs wait tasks-stopped` 는 100회×6초=10분 상한이라 LLM 배치처럼 오래 도는
      # 태스크에 못 쓴다. 다음 회차(1시간) 전에 끝나는지 55분 상한으로 직접 폴링한다.
      - name: Wait for completion and check exit code
        if: steps.dedup.outputs.skip == 'false'
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          TASK_ARN: ${{ steps.run.outputs.arn }}
        run: |
          deadline=$(( $(date +%s) + 3300 ))
          while :; do
            STATUS=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' --output text)
            if [ "$STATUS" = "STOPPED" ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "55분 내에 종료되지 않음 — 태스크는 계속 실행 중이며 다음 회차는 dedup 이 스킵한다" >&2
              exit 1
            fi
            sleep 30
          done
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "exitCode=$EXIT_CODE stoppedReason=$STOP_REASON"
          [ "$EXIT_CODE" = "0" ] || { echo "배치 태스크 비정상 종료" >&2; exit 1; }
