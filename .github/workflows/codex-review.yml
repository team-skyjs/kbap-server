name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        id: diff
        run: |
          DIFF=$(git diff "origin/${{ github.base_ref }}...HEAD")
          {
            echo "diff<<__CODEX_EOF__"
            echo "$DIFF"
            echo "__CODEX_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Review with Codex
        id: codex
        uses: icoretech/codex-action@v0
        with:
          codex_config: ${{ secrets.CODEX_CONFIG_B64 }}
          quiet: 'true'
          timeout: '300'
          prompt: |
            너는 Kotlin / Spring Boot 백엔드를 리뷰하는 시니어 엔지니어다.
            아래 PR diff 를 읽고 한국어로 간결하게 리뷰해라.

            다음을 포함한다:
            - 변경 요약 (무엇이 왜 바뀌었는지)
            - 잠재적 버그 / 로직 오류 / 동시성·트랜잭션 경계 문제
            - 보안 우려 (있다면)
            - 개선 제안 (근거와 함께)

            지적할 게 없으면 솔직하게 "특이사항 없음"이라고 말해라.
            추측은 추측이라고 표시하고, 확실한 것과 구분해라.
          input_text: ${{ steps.diff.outputs.diff }}

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW: ${{ steps.codex.outputs.result }}
        run: |
          gh pr comment "$PR_NUMBER" --body "## 🤖 Codex 자동 코드리뷰

          $REVIEW

          ---
          *Generated by [codex-action](https://github.com/icoretech/codex-action)*"
