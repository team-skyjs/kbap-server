name: Deploy dev

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 이미지 태그(git sha). 비우면 현재 커밋을 빌드한다."
        required: false
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and canary deploy to dev ECS
    runs-on: ubuntu-latest
    environment: dev
    env:
      ECS_NAME: kbap-dev-ecs
    outputs:
      build: ${{ steps.image.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 롤백 입력은 ECR 태그 형식만 허용 — 셸 인젝션·잘못된 태그 차단
            case "$IMAGE_TAG_INPUT" in
              [A-Za-z0-9_]*) ;;
              *) echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1 ;;
            esac
            if printf '%s' "$IMAGE_TAG_INPUT" | grep -q '[^A-Za-z0-9._-]'; then
              echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
            fi
            TAG="$IMAGE_TAG_INPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            TAG="$COMMIT_SHA"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        # dev 는 profile-runtime 스테이지(JDK jcmd·jfr + aws CLI + kbap-profile.jfc)로 배포해
        # k6+JFR 성능 캠페인(#206)을 언제든 붙일 수 있게 한다. prod(deploy-prod.yml)는 슬림 runtime(JRE) 유지.
        run: |
          docker build --platform linux/amd64 --target profile-runtime -t "${{ steps.image.outputs.uri }}" .
          docker push "${{ steps.image.outputs.uri }}"

      # 태스크정의 원본(env·secrets·헬스체크·로그 구성)은 Terraform 소유(iac/terraform) —
      # 파이프라인은 최신 리비전을 복제해 이미지만 교체한다.
      - name: Register new task definition revision
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_NAME-api" \
            --query taskDefinition > taskdef.json
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions |= map(if .name == "api" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' taskdef.json > new-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      # 이전 카나리(bake 15분 포함 ~35분)가 끝나기 전에 새 배포를 만들면 DeploymentLimitExceeded 로
      # 실패한다 — 진행 중 배포가 있으면 종료까지 대기(최대 40분)한 뒤 생성한다. 머지 타이밍 제약 제거.
      - name: Wait for in-flight CodeDeploy deployment
        run: |
          for i in $(seq 1 80); do
            ACTIVE=$(aws deploy list-deployments --application-name "$ECS_NAME-api" \
              --deployment-group-name "$ECS_NAME-api" \
              --include-only-statuses Created Queued InProgress Ready \
              --query 'deployments[0]' --output text)
            [ "$ACTIVE" = "None" ] && exit 0
            echo "in-flight deployment $ACTIVE — 30s 대기 ($i/80)"
            sleep 30
          done
          echo "::error::이전 배포가 40분 내에 끝나지 않았습니다"
          exit 1

      # 카나리(20% 15분 → 100%, 구버전 15분 유지)·5xx 자동 롤백은 CodeDeploy 배포 그룹에
      # 미리 구성돼 있다(인프라 소유). 워크플로우 성공 기준은 "배포 생성"까지 — 이후 성패는
      # CodeDeploy 소관(헬스체크 탈락·알람 발화 시 자동 롤백, 결과는 콘솔·알람으로 확인).
      - name: Create CodeDeploy canary deployment
        env:
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          APPSPEC=$(jq -n --arg arn "$NEW_ARN" '{
            version: 0.0,
            Resources: [{ TargetService: { Type: "AWS::ECS::Service",
              Properties: { TaskDefinition: $arn,
                LoadBalancerInfo: { ContainerName: "api", ContainerPort: 8080 } } } }]
          }')
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$ECS_NAME-api" \
            --deployment-group-name "$ECS_NAME-api" \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":$(jq -Rs . <<<"$APPSPEC")}}" \
            --description "deploy $IMAGE" \
            --query deploymentId --output text)
          echo "deployment: $DEPLOYMENT_ID"
          STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
            --query deploymentInfo.status --output text)
          {
            echo "CodeDeploy 카나리 배포 생성: \`$DEPLOYMENT_ID\` (status: $STATUS)"
            echo '```'
            echo "watch:    aws deploy get-deployment --deployment-id $DEPLOYMENT_ID --query 'deploymentInfo.[status,deploymentOverview]'"
            echo "rollback: aws deploy stop-deployment --deployment-id $DEPLOYMENT_ID --auto-rollback-enabled"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub Release — 본문은 --generate-notes 자동 생성(PR 목록). 재배포(build=false)는 발행하지 않고,
  # 릴리즈 실패는 배포 성공/실패 판정에 영향 없다(별도 잡). 태그: dev-YYYYMMDD-<short-sha> (KST)
  release:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub release with auto notes
        run: |
          TAG="dev-$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_SHA::7}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 이미 존재 — 재실행 멱등 skip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DEV · $(TZ=Asia/Seoul date +%Y-%m-%d) · ${GITHUB_SHA::7}" \
            --generate-notes --prerelease --latest=false
          echo "release: $TAG" >> "$GITHUB_STEP_SUMMARY"
