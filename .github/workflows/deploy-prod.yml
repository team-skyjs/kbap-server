name: Deploy prod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 이미지 태그(이전 커밋 sha). 비우면 현재 커밋을 빌드한다."
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: build and canary deploy to prod ECS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: prod
    env:
      ECS_NAME: kbap-prod-ecs
    outputs:
      build: ${{ steps.image.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 롤백 입력은 ECR 태그 형식만 허용 — 셸 인젝션·잘못된 태그 차단
            case "$IMAGE_TAG_INPUT" in
              [A-Za-z0-9_]*) ;;
              *) echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1 ;;
            esac
            if printf '%s' "$IMAGE_TAG_INPUT" | grep -q '[^A-Za-z0-9._-]'; then
              echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
            fi
            TAG="$IMAGE_TAG_INPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            TAG="$COMMIT_SHA"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        run: |
          docker build --platform linux/amd64 -t "${{ steps.image.outputs.uri }}" .
          docker push "${{ steps.image.outputs.uri }}"

      # 태스크정의 원본(env·secrets·헬스체크·로그 구성)은 Terraform 소유(iac/terraform) —
      # 파이프라인은 최신 리비전을 복제해 이미지만 교체한다.
      - name: Register new task definition revision
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_NAME-api" \
            --query taskDefinition > taskdef.json
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions |= map(if .name == "api" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' taskdef.json > new-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Create CodeDeploy canary deployment
        id: canary
        env:
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          APPSPEC=$(jq -n --arg arn "$NEW_ARN" '{
            version: 0.0,
            Resources: [{ TargetService: { Type: "AWS::ECS::Service",
              Properties: { TaskDefinition: $arn,
                LoadBalancerInfo: { ContainerName: "api", ContainerPort: 8080 } } } }]
          }')
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$ECS_NAME-api" \
            --deployment-group-name "$ECS_NAME-api" \
            --revision "{\"revisionType\":\"AppSpecContent\",\"appSpecContent\":{\"content\":$(jq -Rs . <<<"$APPSPEC")}}" \
            --description "deploy $IMAGE" \
            --query deploymentId --output text)
          echo "deployment: $DEPLOYMENT_ID"
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
            --query deploymentInfo.status --output text)
          {
            echo "CodeDeploy 카나리 배포 생성: \`$DEPLOYMENT_ID\` (status: $STATUS)"
            echo '```'
            echo "watch:    aws deploy get-deployment --deployment-id $DEPLOYMENT_ID --query 'deploymentInfo.[status,deploymentOverview]'"
            echo "rollback: aws deploy stop-deployment --deployment-id $DEPLOYMENT_ID --auto-rollback-enabled"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for canary completion
        id: canary_wait
        env:
          DEPLOYMENT_ID: ${{ steps.canary.outputs.id }}
        run: |
          STATUS=InProgress
          for i in $(seq 1 360); do
            STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --query deploymentInfo.status --output text)
            case "$STATUS" in Succeeded|Failed|Stopped) break ;; esac
            sleep 10
          done
          case "$STATUS" in
            Succeeded|Failed|Stopped) ;;
            *)
              echo "::warning::폴링 상한 초과 — 배포를 중단(자동 롤백)하고 종료를 기다립니다: $DEPLOYMENT_ID"
              aws deploy stop-deployment --deployment-id "$DEPLOYMENT_ID" --auto-rollback-enabled || true
              for j in $(seq 1 90); do
                STATUS=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                  --query deploymentInfo.status --output text)
                case "$STATUS" in Succeeded|Failed|Stopped) break ;; esac
                sleep 10
              done
              ;;
          esac
          if [ "$STATUS" != "Succeeded" ]; then
            ROLLBACK_ID=""
            for j in $(seq 1 12); do
              ROLLBACK_ID=$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                --query deploymentInfo.rollbackInfo.rollbackDeploymentId --output text)
              [ -n "$ROLLBACK_ID" ] && [ "$ROLLBACK_ID" != "None" ] && break
              sleep 5
            done
            if [ -n "$ROLLBACK_ID" ] && [ "$ROLLBACK_ID" != "None" ]; then
              echo "롤백 배포 종료 대기: $ROLLBACK_ID" >> "$GITHUB_STEP_SUMMARY"
              for j in $(seq 1 90); do
                RB_STATUS=$(aws deploy get-deployment --deployment-id "$ROLLBACK_ID" \
                  --query deploymentInfo.status --output text)
                case "$RB_STATUS" in Succeeded|Failed|Stopped) break ;; esac
                sleep 10
              done
            fi
          fi
          ELAPSED=$((i * 10))
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "elapsed=$((ELAPSED / 60))m $((ELAPSED % 60))s" >> "$GITHUB_OUTPUT"
          echo "카나리 종료: $STATUS (약 ${ELAPSED}s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::카나리가 성공으로 끝나지 않았습니다: $STATUS"
            exit 1
          fi

      - name: Notify Slack
        if: always() && steps.canary.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ steps.image.outputs.tag }}
          DEPLOYMENT_ID: ${{ steps.canary.outputs.id }}
          STATUS: ${{ steps.canary_wait.outputs.status || 'UNKNOWN' }}
          ELAPSED: ${{ steps.canary_wait.outputs.elapsed || '-' }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SLACK_RELEASE_WEBHOOK_URL 미설정 — 통지 생략"; exit 0; fi
          AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/pulls" \
            --jq '.[0].user.login // empty' 2>/dev/null || true)
          AUTHOR=${AUTHOR:-$GITHUB_ACTOR}
          SHORT=${DEPLOY_SHA::7}
          if [ "$STATUS" = "Succeeded" ]; then ICON="✅"; TITLE="PROD 배포 완료"
          else ICON="🚨"; TITLE="PROD 배포 실패 — $STATUS"; fi
          CONSOLE="https://ap-northeast-2.console.aws.amazon.com/codesuite/codedeploy/deployments/$DEPLOYMENT_ID?region=ap-northeast-2"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg icon "$ICON" --arg title "$TITLE" --arg sha "$SHORT" \
            --arg sha_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$DEPLOY_SHA" \
            --arg author "$AUTHOR" --arg elapsed "$ELAPSED" --arg status "$STATUS" \
            --arg dep "$DEPLOYMENT_ID" --arg console "$CONSOLE" --arg run "$RUN_URL" '
            { blocks: [
              { type: "header", text: { type: "plain_text", text: ($icon + " " + $title), emoji: true } },
              { type: "section", fields: [
                { type: "mrkdwn", text: ("*커밋*\n<" + $sha_url + "|`" + $sha + "`>") },
                { type: "mrkdwn", text: ("*작성자*\n" + $author) },
                { type: "mrkdwn", text: ("*소요*\n" + $elapsed) },
                { type: "mrkdwn", text: ("*상태*\n" + $status) }
              ] },
              { type: "context", elements: [
                { type: "mrkdwn", text: ("<" + $console + "|CodeDeploy 콘솔> · <" + $run + "|Actions 실행> · `" + $dep + "`") }
              ] }
            ] }' \
          | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null \
          || echo "::warning::슬랙 통지 실패(배포 판정 무영향)"

  # GitHub Release — 본문은 --generate-notes 자동 생성(PR 목록). 재배포(build=false)는 발행하지 않고,
  # 릴리즈 실패는 배포 성공/실패 판정에 영향 없다(별도 잡). 태그: prod-YYYYMMDD-<short-sha> (KST)
  release:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub release with auto notes
        run: |
          TAG="prod-$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_SHA::7}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 이미 존재 — 재실행 멱등 skip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq 'map(.tagName | select(startswith("prod-")))[0] // empty')
          NOTES_START=()
          [ -n "$PREV_TAG" ] && NOTES_START=(--notes-start-tag "$PREV_TAG")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PROD · $(TZ=Asia/Seoul date +%Y-%m-%d) · ${GITHUB_SHA::7}" \
            --generate-notes "${NOTES_START[@]}"
          echo "release: $TAG" >> "$GITHUB_STEP_SUMMARY"
