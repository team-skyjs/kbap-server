name: Deploy prod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 이미지 태그(이전 커밋 sha). 비우면 현재 커밋을 빌드한다."
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: build and blue/green deploy to prod ECS
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      build: ${{ steps.image.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            # 롤백 입력은 ECR 태그 형식만 허용 — 셸 인젝션·잘못된 태그 차단
            case "$IMAGE_TAG_INPUT" in
              [A-Za-z0-9_]*) ;;
              *) echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1 ;;
            esac
            if printf '%s' "$IMAGE_TAG_INPUT" | grep -q '[^A-Za-z0-9._-]'; then
              echo "invalid image_tag: $IMAGE_TAG_INPUT" >&2; exit 1
            fi
            TAG="$IMAGE_TAG_INPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            TAG="$COMMIT_SHA"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        run: |
          docker build --platform linux/amd64 -t "${{ steps.image.outputs.uri }}" .
          docker push "${{ steps.image.outputs.uri }}"

      - name: Register new task definition revision
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          CURRENT_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT_ARN" \
            --query taskDefinition > taskdef.json
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' taskdef.json > new-taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      # 블루/그린 전략·타깃그룹·bake time·리스너는 ECS 서비스에 미리 구성돼 있어야 한다(인프라 소유).
      # 여기서 --deployment-configuration 을 넘기지 않는 것은 의도적 — 넘기면 미지정 하위필드(bakeTime·
      # 서킷브레이커)가 기본값으로 덮어써진다. 파이프라인은 태스크정의만 교체해 블루/그린을 트리거한다.
      - name: Update ECS service (native blue/green)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "triggered blue/green deployment: $SERVICE -> $NEW_ARN"

          # 워크플로우 성공 기준은 "배포 시작"까지다(KB-242, DoD 대안 3). 이후의 성패 판정은
          # 전부 ECS 소관 — 기동 실패·헬스체크 탈락은 서킷브레이커가 롤백하고, 카나리·bake 는
          # 관찰 기간이며, 결과는 ECS 콘솔·알람으로 확인한다.
          # 파이프라인에서 "헬시"를 추정하지 않는 이유: runningCount 는 RUNNING 태스크 수일 뿐
          # 헬스체크 통과를 뜻하지 않고, 카나리(신규 20% 트래픽) 구조에선 완료 전까지
          # rolloutState 도 IN_PROGRESS 라 어떤 중간 신호도 성패의 근거가 못 된다.
          # 여기서 검증하는 유일한 사실: PRIMARY 배포가 새 태스크정의로 실제 시작됐는가.
          for i in 1 2 3 4 5 6; do
            PRIMARY_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY']|[0].taskDefinition" --output text 2>/dev/null || echo none)
            if [ "$PRIMARY_ARN" = "$NEW_ARN" ]; then
              echo "deployment started: PRIMARY -> $NEW_ARN"
              {
                echo "배포 시작 확인 완료 — 이후 카나리(20%)·bake·롤백 판정은 ECS 소관"
                echo "기동 실패·헬스체크 탈락은 서킷브레이커가 롤백하며, 결과는 ECS 콘솔·알람으로 확인한다"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting for PRIMARY deployment to switch... ($i/6, current: $PRIMARY_ARN)"
            sleep 10
          done
          echo "::error::배포 시작 확인 실패 — PRIMARY 태스크정의가 60s 안에 교체되지 않았다"
          exit 1

  # 릴리즈 노트·슬랙 알림(KB-266) — "배포 시작 확인" 시점 기준 발행, 실패해도 배포 판정에 영향 없음
  release:
    needs: deploy
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      environment: prod
      prerelease: false
      sha: ${{ github.sha }}
      redeploy: ${{ needs.deploy.outputs.build != 'true' }}
      deploy_result: ${{ needs.deploy.result }}
    secrets:
      SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
