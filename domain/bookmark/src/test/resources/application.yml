spring:
  # 서비스 수준 통합 테스트: MySQL Testcontainers(@ServiceConnection)에 붙되, 이 모듈엔 마이그레이션이 없으므로
  # 스키마는 Hibernate 가 엔티티에서 생성한다. create-drop 의 '존재하지 않는 FK drop' 소음을 피해
  # JPA 표준 schema-generation=create(선-drop 없는 생성 전용)를 쓴다.
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.schema-generation.database.action: create
