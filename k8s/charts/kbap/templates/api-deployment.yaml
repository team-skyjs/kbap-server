{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbap.api.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "kbap.labels" . | nindent 4 }}
    app: {{ .Values.api.name }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
        {{- include "kbap.labels" . | nindent 8 }}
      annotations:
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.api.serviceAccount.automount }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.image.api.repository .Values.image.api.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.startupPath }}
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessPath }}
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessPath }}
              port: {{ .Values.api.containerPort }}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- range .Values.api.envFrom }}
            - secretRef:
                name: {{ .secretRef.name }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.api.nodeSelector | nindent 8 }}
{{- end }}
