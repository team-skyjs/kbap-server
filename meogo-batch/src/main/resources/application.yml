spring:
  # 루트의 .env 를 properties 형식으로 읽어 ${...} 플레이스홀더에 사용한다(없으면 조용히 건너뜀).
  config:
    import: optional:file:.env[.properties]
  application:
    name: meogo-batch
  # 배치는 스키마 owner 가 아니다 — 마이그레이션은 meogo-api 가 책임진다(중복 적용 방지).
  flyway:
    enabled: false
  ai:
    model:
      # LLM 자동구성이 키 없이 떠서 부팅이 깨지지 않도록 기본 비활성.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
# datasource 등 실제 배치 잡 설정은 잡 도입 시 프로필별로 추가한다.
