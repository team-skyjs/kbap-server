push.helpful.1.title=レビューにどんな反応が？ 👀
push.helpful.1.body={food}のレビューに「役に立った」が届きました。見てみませんか。

push.helpful.2.title=「役に立った」が1件届きました 👍
push.helpful.2.body={food}のレビューに誰かが「役に立った」を押してくれました。

push.helpful.3.title=誰かの役に立ちました 💛
push.helpful.3.body={food}のレビューに「役に立った」が届きました。体験のシェア、ありがとうございます。

push.scan_suggestion.1.title=👀 料理名だけで選んでいませんか？
push.scan_suggestion.1.body=どんな料理か気になったら、メニューをスキャンしてみませんか。

push.scan_suggestion.2.title=📷 注文前にメニューをチェック
push.scan_suggestion.2.body=メニューをスキャンすると、料理の説明が読めます。

push.scan_suggestion.3.title=知らない料理が気になったら ✨
push.scan_suggestion.3.body=初めて見るメニューをスキャンして、新しい料理を知ってみませんか。

push.scan_suggestion.lunch.1.title=ランチはどんな料理でしょう？ 👀
push.scan_suggestion.lunch.1.body=ランチに知らない料理があったら、メニューをスキャンしてみませんか。

push.scan_suggestion.lunch.2.title=📷 ランチの注文前にチェック
push.scan_suggestion.lunch.2.body=ランチのメニューをスキャンすると、料理の説明が読めます。

push.scan_suggestion.lunch.3.title=ランチに新しい料理はいかが？ ✨
push.scan_suggestion.lunch.3.body=今日のランチはメニューをスキャンして、新しい料理を探してみませんか。

push.scan_suggestion.dinner.1.title=夕食はどんな料理でしょう？ 👀
push.scan_suggestion.dinner.1.body=夕食の料理が気になったら、メニューをスキャンしてみませんか。

push.scan_suggestion.dinner.2.title=📷 夕食の注文前にチェック
push.scan_suggestion.dinner.2.body=夕食のメニューをスキャンすると、料理の説明が読めます。

push.scan_suggestion.dinner.3.title=夕食に新しい料理はいかが？ ✨
push.scan_suggestion.dinner.3.body=夕食に新しい料理を探したいときは、メニューをスキャンしてみませんか。

push.review_reminder.1.title=また食べたい味でしたか？ 💬
push.review_reminder.1.body=スキャンした{food}、食べてみましたか？レビューで教えてください。

push.review_reminder.2.title=レビューはひとことでも ✍️
push.review_reminder.2.body=スキャンした{food}を食べたら、味の感想をひとこと残してみませんか。

push.review_reminder.3.title=次に食べる人に伝えませんか？ 💛
push.review_reminder.3.body=スキャンした{food}を食べたら、体験をレビューでシェアしませんか。

push.meal_time.1.title=食事の時間、何にしますか？ 🍽️
push.meal_time.1.body=近くのお店のメニューをスキャンしてみませんか。

push.meal_time.2.title=📷 食事の前にメニューをチェック
push.meal_time.2.body=食事の時間です。近くのお店のメニューをスキャンして、料理を調べてみませんか。

push.meal_time.3.title=今度は違う料理にしませんか？ ✨
push.meal_time.3.body=食事の時間です。近くのお店のメニューをスキャンして、新しい料理を探しましょう。

