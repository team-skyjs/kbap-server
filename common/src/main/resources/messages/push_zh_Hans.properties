push.helpful.1.title=你的评价收到什么反馈了？ 👀
push.helpful.1.body=你的{food}评价收到了“有帮助”。来看看吧。

push.helpful.2.title=收到一个“有帮助” 👍
push.helpful.2.body=有人为你的{food}评价点了“有帮助”。

push.helpful.3.title=你帮到别人了 💛
push.helpful.3.body=你的{food}评价收到了“有帮助”。谢谢你分享体验。

push.scan_suggestion.1.title=👀 只看菜名，不好选吧？
push.scan_suggestion.1.body=想知道是什么菜？扫一扫菜单吧。

push.scan_suggestion.2.title=📷 点餐前先看看菜单
push.scan_suggestion.2.body=扫一扫菜单，就能查看菜品介绍。

push.scan_suggestion.3.title=想了解没吃过的菜？ ✨
push.scan_suggestion.3.body=遇到不熟悉的菜单，扫一扫就能了解新菜品。

push.scan_suggestion.lunch.1.title=午餐会是什么菜呢？ 👀
push.scan_suggestion.lunch.1.body=午餐的菜不熟悉？扫一扫菜单吧。

push.scan_suggestion.lunch.2.title=📷 点午餐前先看看菜单
push.scan_suggestion.lunch.2.body=扫一扫午餐菜单，就能查看菜品介绍。

push.scan_suggestion.lunch.3.title=午餐尝点新菜怎么样？ ✨
push.scan_suggestion.lunch.3.body=今天午餐扫一扫菜单，找找没吃过的菜吧。

push.scan_suggestion.dinner.1.title=晚餐会是什么菜呢？ 👀
push.scan_suggestion.dinner.1.body=想了解晚餐的菜？扫一扫菜单吧。

push.scan_suggestion.dinner.2.title=📷 点晚餐前先看看菜单
push.scan_suggestion.dinner.2.body=扫一扫晚餐菜单，就能查看菜品介绍。

push.scan_suggestion.dinner.3.title=晚餐换个新口味？ ✨
push.scan_suggestion.dinner.3.body=想找没吃过的晚餐菜品？扫一扫菜单吧。

push.review_reminder.1.title=还想再吃一次吗？ 💬
push.review_reminder.1.body=扫描过的{food}，你尝过了吗？写条评价告诉我们吧。

push.review_reminder.2.title=评价写一句也可以 ✍️
push.review_reminder.2.body=尝过扫描过的{food}了吗？简单写写味道怎么样吧。

push.review_reminder.3.title=给下一位食客一点参考？ 💛
push.review_reminder.3.body=尝过扫描过的{food}了吗？写条评价分享你的体验吧。

push.meal_time.1.title=到饭点了，吃什么呢？ 🍽️
push.meal_time.1.body=试试扫一扫附近餐厅的菜单吧。

push.meal_time.2.title=📷 吃饭前先看看菜单
push.meal_time.2.body=到饭点了。扫一扫附近餐厅的菜单，了解一下菜品吧。

push.meal_time.3.title=这次换道菜怎么样？ ✨
push.meal_time.3.body=到饭点了。扫一扫附近餐厅的菜单，找找没吃过的菜吧。

