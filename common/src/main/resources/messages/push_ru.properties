push.helpful.1.title=Как отреагировали на отзыв? 👀
push.helpful.1.body=Отзыв о {food} отметили как полезный. Посмотрите.

push.helpful.2.title=Ещё одна отметка «полезный» 👍
push.helpful.2.body=Кто-то отметил ваш отзыв о {food} как полезный.

push.helpful.3.title=Вы кому-то помогли 💛
push.helpful.3.body=Отзыв о {food} отмечен как полезный. Спасибо за отзыв.

push.scan_suggestion.1.title=👀 Выбираете лишь по названию?
push.scan_suggestion.1.body=Не знаете, что за блюдо? Отсканируйте меню.

push.scan_suggestion.2.title=📷 Изучите меню перед заказом
push.scan_suggestion.2.body=Отсканируйте меню, чтобы прочитать описания блюд.

push.scan_suggestion.3.title=Интересно новое блюдо? ✨
push.scan_suggestion.3.body=Отсканируйте незнакомое меню и узнайте о новых блюдах.

push.scan_suggestion.lunch.1.title=Что на обед? 👀
push.scan_suggestion.lunch.1.body=Незнакомые блюда на обед? Отсканируйте меню.

push.scan_suggestion.lunch.2.title=📷 Изучите меню перед обедом
push.scan_suggestion.lunch.2.body=Отсканируйте обеденное меню и прочитайте описания блюд.

push.scan_suggestion.lunch.3.title=Новое блюдо на обед? ✨
push.scan_suggestion.lunch.3.body=Сегодня за обедом отсканируйте меню и найдите новое блюдо.

push.scan_suggestion.dinner.1.title=Что на ужин? 👀
push.scan_suggestion.dinner.1.body=Интересно, что за блюда на ужин? Отсканируйте меню.

push.scan_suggestion.dinner.2.title=📷 Изучите меню перед ужином
push.scan_suggestion.dinner.2.body=Отсканируйте меню на ужин и прочитайте описания блюд.

push.scan_suggestion.dinner.3.title=На ужин что-то новое? ✨
push.scan_suggestion.dinner.3.body=Хотите новое блюдо на ужин? Отсканируйте меню.

push.review_reminder.1.title=Хотите попробовать снова? 💬
push.review_reminder.1.body=Сканировали {food}? Уже попробовали? Напишите отзыв.

push.review_reminder.2.title=Для отзыва хватит и фразы ✍️
push.review_reminder.2.body=Попробовали {food} после сканирования? Кратко опишите вкус.

push.review_reminder.3.title=Поможете другим с выбором? 💛
push.review_reminder.3.body=Попробовали {food} после сканирования? Поделитесь в отзыве.

push.meal_time.1.title=Пора есть. Что выбрать? 🍽️
push.meal_time.1.body=Попробуйте отсканировать меню в ресторане поблизости.

push.meal_time.2.title=📷 Изучите меню перед едой
push.meal_time.2.body=Пора есть. Сканируйте меню в кафе рядом и узнайте о блюдах.

push.meal_time.3.title=Как насчёт другого блюда? ✨
push.meal_time.3.body=Пора есть. Сканируйте меню рядом и найдите новое блюдо.

push.news.1.title={title}
push.news.1.body={body}

push.opt-out=Отключить: Профиль > Настройки уведомлений
