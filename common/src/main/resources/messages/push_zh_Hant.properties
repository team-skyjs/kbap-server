push.helpful.1.title=你的評論收到什麼回應了？ 👀
push.helpful.1.body=你的{food}評論收到了「有幫助」。來看看吧。

push.helpful.2.title=收到一個「有幫助」 👍
push.helpful.2.body=有人為你的{food}評論點了「有幫助」。

push.helpful.3.title=你幫到別人了 💛
push.helpful.3.body=你的{food}評論收到了「有幫助」。謝謝你分享體驗。

push.scan_suggestion.1.title=👀 只看菜名，不好選吧？
push.scan_suggestion.1.body=想知道是什麼料理？掃描菜單看看吧。

push.scan_suggestion.2.title=📷 點餐前先看看菜單
push.scan_suggestion.2.body=掃描菜單，就能查看料理介紹。

push.scan_suggestion.3.title=想認識沒吃過的料理？ ✨
push.scan_suggestion.3.body=遇到不熟悉的菜單，掃描一下就能認識新料理。

push.scan_suggestion.lunch.1.title=午餐會是什麼料理呢？ 👀
push.scan_suggestion.lunch.1.body=午餐有不熟悉的料理？掃描菜單看看吧。

push.scan_suggestion.lunch.2.title=📷 點午餐前先看看菜單
push.scan_suggestion.lunch.2.body=掃描午餐菜單，就能查看料理介紹。

push.scan_suggestion.lunch.3.title=午餐試試新料理如何？ ✨
push.scan_suggestion.lunch.3.body=今天午餐掃描菜單，找找沒吃過的料理吧。

push.scan_suggestion.dinner.1.title=晚餐會是什麼料理呢？ 👀
push.scan_suggestion.dinner.1.body=想了解晚餐的料理？掃描菜單看看吧。

push.scan_suggestion.dinner.2.title=📷 點晚餐前先看看菜單
push.scan_suggestion.dinner.2.body=掃描晚餐菜單，就能查看料理介紹。

push.scan_suggestion.dinner.3.title=晚餐換個新口味？ ✨
push.scan_suggestion.dinner.3.body=想找沒吃過的晚餐料理？掃描菜單看看吧。

push.review_reminder.1.title=還想再吃一次嗎？ 💬
push.review_reminder.1.body=掃描過的{food}，你吃過了嗎？寫則評論告訴我們吧。

push.review_reminder.2.title=評論寫一句也可以 ✍️
push.review_reminder.2.body=吃過掃描過的{food}了嗎？簡單寫寫味道如何吧。

push.review_reminder.3.title=給下一位食客一點參考？ 💛
push.review_reminder.3.body=吃過掃描過的{food}了嗎？寫則評論分享你的體驗吧。

push.meal_time.1.title=用餐時間，吃什麼好呢？ 🍽️
push.meal_time.1.body=試著掃描附近餐廳的菜單吧。

push.meal_time.2.title=📷 用餐前先看看菜單
push.meal_time.2.body=用餐時間到了。掃描附近餐廳的菜單，了解一下料理吧。

push.meal_time.3.title=這次換道料理如何？ ✨
push.meal_time.3.body=用餐時間到了。掃描附近餐廳的菜單，找找沒吃過的料理吧。

