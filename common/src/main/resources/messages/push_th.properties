push.helpful.1.title=รีวิวมีเสียงตอบรับอะไรบ้าง? 👀
push.helpful.1.body=รีวิว {food} ได้รับ “มีประโยชน์” ลองดูเลย

push.helpful.2.title=ได้ “มีประโยชน์” เพิ่ม 1 👍
push.helpful.2.body=มีคนกด “มีประโยชน์” ให้รีวิว {food} ของคุณ

push.helpful.3.title=คุณช่วยคนอื่นได้แล้ว 💛
push.helpful.3.body=รีวิว {food} ได้รับ “มีประโยชน์” ขอบคุณที่แบ่งปันนะ

push.scan_suggestion.1.title=👀 เลือกจากชื่ออย่างเดียวเหรอ?
push.scan_suggestion.1.body=อยากรู้ว่าเป็นอาหารอะไร ลองสแกนเมนูดูนะ

push.scan_suggestion.2.title=📷 ดูเมนูก่อนสั่งอาหาร
push.scan_suggestion.2.body=สแกนเมนูเพื่ออ่านคำอธิบายอาหารได้เลย

push.scan_suggestion.3.title=อยากรู้จักอาหารใหม่ ๆ ไหม? ✨
push.scan_suggestion.3.body=ลองสแกนเมนูที่ไม่คุ้นเคย เพื่อรู้จักอาหารใหม่ ๆ นะ

push.scan_suggestion.lunch.1.title=มื้อเที่ยงมีอะไรบ้างนะ? 👀
push.scan_suggestion.lunch.1.body=ไม่คุ้นกับอาหารมื้อเที่ยง ลองสแกนเมนูดูนะ

push.scan_suggestion.lunch.2.title=📷 ดูเมนูก่อนสั่งมื้อเที่ยง
push.scan_suggestion.lunch.2.body=สแกนเมนูมื้อเที่ยงเพื่ออ่านคำอธิบายอาหารได้เลย

push.scan_suggestion.lunch.3.title=มื้อเที่ยงลองเมนูใหม่ไหม? ✨
push.scan_suggestion.lunch.3.body=เที่ยงนี้ลองสแกนเมนูเพื่อหาอาหารใหม่ ๆ ดูนะ

push.scan_suggestion.dinner.1.title=มื้อเย็นมีอะไรบ้างนะ? 👀
push.scan_suggestion.dinner.1.body=อยากรู้จักอาหารมื้อเย็น ลองสแกนเมนูดูนะ

push.scan_suggestion.dinner.2.title=📷 ดูเมนูก่อนสั่งมื้อเย็น
push.scan_suggestion.dinner.2.body=สแกนเมนูมื้อเย็นเพื่ออ่านคำอธิบายอาหารได้เลย

push.scan_suggestion.dinner.3.title=มื้อเย็นลองอะไรใหม่ไหม? ✨
push.scan_suggestion.dinner.3.body=อยากหาอาหารใหม่ ๆ สำหรับมื้อเย็น ลองสแกนเมนูดูนะ

push.review_reminder.1.title=อยากทานอีกไหม? 💬
push.review_reminder.1.body=ได้ลอง {food} ที่สแกนไว้หรือยัง? เขียนรีวิวบอกกันนะ

push.review_reminder.2.title=รีวิวแค่ประโยคเดียวก็ได้ ✍️
push.review_reminder.2.body=ลอง {food} ที่สแกนไว้แล้วใช่ไหม? รีวิวรสชาติสั้น ๆ ได้นะ

push.review_reminder.3.title=บอกต่อคนที่จะทานดีไหม? 💛
push.review_reminder.3.body=ถ้าลอง {food} ที่สแกนไว้แล้ว เขียนรีวิวแบ่งปันกันนะ

push.meal_time.1.title=ได้เวลาทาน เลือกอะไรดี? 🍽️
push.meal_time.1.body=ลองสแกนเมนูร้านอาหารใกล้ ๆ ดูนะ

push.meal_time.2.title=📷 ดูเมนูก่อนทานกัน
push.meal_time.2.body=ได้เวลาทานแล้ว สแกนเมนูร้านใกล้ ๆ เพื่อรู้จักอาหารกัน

push.meal_time.3.title=ครั้งนี้ลองอาหารอื่นไหม? ✨
push.meal_time.3.body=ได้เวลาทานแล้ว สแกนเมนูร้านใกล้ ๆ หาอาหารใหม่ ๆ กัน

push.news.1.title={title}
push.news.1.body={body}

