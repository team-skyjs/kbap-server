push.helpful.3.body=Ulasan {food} kamu dinilai bermanfaat. Terima kasih sudah berbagi.

push.scan_suggestion.1.title=👀 Pilih hanya dari nama?
push.scan_suggestion.1.body=Belum tahu hidangannya? Pindai menu untuk mencari tahu.

push.scan_suggestion.2.title=📷 Cek sebelum pesan
push.scan_suggestion.2.body=Pindai menu untuk membaca penjelasan hidangannya.

push.scan_suggestion.3.title=Penasaran hidangan baru? ✨
push.scan_suggestion.3.body=Pindai menu yang belum kamu kenal untuk mempelajari hidangan baru.

push.scan_suggestion.lunch.1.title=Makan siang apa, ya? 👀
push.scan_suggestion.lunch.1.body=Belum kenal hidangan makan siangnya? Coba pindai menu.

push.scan_suggestion.lunch.2.title=📷 Cek menu makan siang
push.scan_suggestion.lunch.2.body=Pindai menu makan siang untuk membaca penjelasan hidangannya.

push.scan_suggestion.lunch.3.title=Coba menu siang baru? ✨
push.scan_suggestion.lunch.3.body=Siang ini, pindai menu untuk menemukan hidangan baru.

push.scan_suggestion.dinner.1.title=Makan malam apa, ya? 👀
push.scan_suggestion.dinner.1.body=Penasaran dengan hidangan makan malamnya? Coba pindai menu.

push.scan_suggestion.dinner.2.title=📷 Cek menu makan malam
push.scan_suggestion.dinner.2.body=Pindai menu makan malam untuk membaca penjelasan hidangannya.

push.scan_suggestion.dinner.3.title=Makan malam yang baru? ✨
push.scan_suggestion.dinner.3.body=Ingin hidangan baru untuk makan malam? Coba pindai menu.

push.review_reminder.1.title=Mau makan lagi? 💬
push.review_reminder.1.body=Sudah coba {food} setelah memindai menu? Ceritakan lewat ulasan.

