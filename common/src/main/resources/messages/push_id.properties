push.helpful.1.title=Apa tanggapan ulasanmu? 👀
push.helpful.1.body=Ulasan {food} kamu dinilai bermanfaat. Yuk, lihat.

push.helpful.2.title=1 tanda bermanfaat baru 👍
push.helpful.2.body=Seseorang menandai ulasan {food} kamu sebagai bermanfaat.

