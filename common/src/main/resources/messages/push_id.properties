push.review_reminder.3.body=Sudah coba {food} setelah memindai menu? Bagikan pengalaman lewat ulasan.

push.meal_time.1.title=Waktunya makan, pilih apa? 🍽️
push.meal_time.1.body=Coba pindai menu di restoran terdekat.

push.meal_time.2.title=📷 Lihat menu sebelum makan
push.meal_time.2.body=Waktunya makan. Pindai menu restoran terdekat untuk mengenal hidangannya.

push.meal_time.3.title=Kali ini coba yang lain? ✨
push.meal_time.3.body=Waktunya makan. Pindai menu restoran terdekat untuk menemukan hidangan baru.

