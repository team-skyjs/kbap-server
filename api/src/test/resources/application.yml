spring:
  # 테스트 컨텍스트: 외부 키에 의존하지 않게 한다. DB 는 MySQL Testcontainers(@ServiceConnection)로 붙는다(KB-46).
  # 운영과 동일한 Flyway 마이그레이션으로 스키마를 만들고(ddl-auto=validate 로 엔티티↔스키마 정합만 검증),
  # 마이그레이션 SQL 자체를 실 MySQL 에서 검증한다.
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.generate_statistics: true
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

kbap:
  auth:
    firebase:
      # 테스트는 실제 Firebase 를 호출하지 않는다 — SocialTokenVerifier 를 페이크 빈으로 대체한다.
      credentials-path: ""
    jwt:
      secret: kb118-test-secret-key-at-least-32-bytes-long
      access-ttl: 30m
      refresh-ttl: 14d
  # 이미지 업로드 정책(KB-145). 실 S3 는 미구성(bucket 없음) — PresignedUploadPort 는 테스트 페이크 빈으로 대체한다.
  storage:
    public-base-url: https://cdn.test
    key-prefix: local
  upload:
    allowed-content-types: image/jpeg,image/png
    max-bytes: 1048576
    upload-ttl: PT5M
