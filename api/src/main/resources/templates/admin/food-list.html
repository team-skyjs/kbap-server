<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: shell('음식 목록', 'food-list', ~{:: .food-list-main})}">
<body>
<section class="food-list-main">
    <h1 class="page-title">음식 목록</h1>
    <p class="page-desc" th:text="|전체 ${#numbers.formatInteger(foodPage.totalCount, 0, 'COMMA')}건 · 페이지당 200건|">전체 0건</p>

    <form class="food-search" method="get" th:action="@{/admin/foods/list}">
        <input name="q" type="search" placeholder="음식명 검색" th:value="${foodPage.query}">
        <select name="status" class="field-select">
            <option value="" th:selected="${foodPage.status == null}">전체 상태</option>
            <option th:each="s : ${T(com.kbap.common.domain.food.model.FoodContentStatus).values()}"
                    th:value="${s}" th:text="${s}" th:selected="${s == foodPage.status}"></option>
        </select>
        <button class="page-btn" type="submit">검색</button>
    </form>

    <form class="food-search" method="post" th:action="@{/admin/foods/recollect}"
          th:onsubmit="|return confirm('현재 조건에 걸린 ${foodPage.totalCount}건의 콘텐츠를 다시 수집 요청합니다. 진행할까요?')|">
        <input type="hidden" name="page" th:value="${foodPage.page}">
        <input type="hidden" name="q" th:value="${foodPage.query}">
        <input type="hidden" name="status" th:value="${foodPage.status}">
        <span class="page-info" th:text="|현재 조건 ${#numbers.formatInteger(foodPage.totalCount, 0, 'COMMA')}건|">0건</span>
        <button class="page-btn" type="submit">콘텐츠 재수집 요청</button>
    </form>

    <div class="banner banner-ok" th:if="${param.updated != null}"
         th:text="|음식 #${param.updated[0]} 수정 완료|"></div>
    <div class="banner banner-ok" th:if="${param.deleted != null}"
         th:text="|음식 #${param.deleted[0]} 삭제 완료|"></div>
    <div class="banner banner-ok" th:if="${param.recollected != null}"
         th:text="|재수집 요청 ${param.recollected[0]}건 등록 · 이미 대기 중이라 건너뜀 ${param.recollectSkipped[0]}건|"></div>
    <div class="banner banner-error" th:if="${param.recollectError != null}"
         th:with="code=${param.recollectError[0]}"
         th:text="${code == 'too-many'} ? |대상이 1회 상한(${param.recollectMax[0]}건)을 넘습니다. 검색어·상태로 범위를 좁혀 주세요|
                : (${code == 'no-target'} ? '조건에 걸린 음식이 없습니다' : '재수집 요청 중 오류가 발생했습니다')"></div>
    <div class="banner banner-error" th:if="${param.error != null and param.detail == null}">
        처리 중 오류가 발생했습니다
    </div>

    <div class="food-grid-viewport">
        <div class="food-grid" th:if="${!foodPage.items.isEmpty()}">
            <a class="card food-card" th:each="f : ${foodPage.items}"
               th:href="@{/admin/foods/list(page=${foodPage.page}, q=${foodPage.query}, status=${foodPage.status}, detail=${f.id})}">
                <div class="food-card-thumb">
                    <img th:if="${f.imageUrl != null}" th:src="${f.imageUrl}" th:alt="${f.koreanName}" loading="lazy"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
                    <div class="image-placeholder" th:style="${f.imageUrl != null} ? 'display:none'">이미지 없음</div>
                </div>
                <div class="food-card-body">
                    <strong class="food-card-name" th:text="${f.koreanName}" th:title="${f.koreanName}">김치찌개</strong>
                    <span class="badge"
                          th:classappend="${f.contentStatus.name() == 'READY'} ? 'badge-ok'
                                        : (${f.contentStatus.name() == 'FAILED'} ? 'badge-warn'
                                        : (${f.contentStatus.name() == 'PENDING_REVIEW'} ? 'badge-info' : 'badge-progress'))"
                          th:text="${f.contentStatus}">READY</span>
                    <span class="badge badge-warn" th:if="${f.contentFailureKind != null and f.contentFailureKind.name() == 'INGREDIENT_GUARD'}"
                          title="재료 판정 미달 — 사람이 재료를 확인해야 합니다">재료 확인</span>
                </div>
            </a>
        </div>

        <div class="card empty-state" th:if="${foodPage.items.isEmpty()}"
             th:with="filtered=${foodPage.query != null or foodPage.status != null}">
            <th:block th:if="${filtered}">
                검색 결과가 없습니다.
                <a class="page-btn" th:href="@{/admin/foods/list}">전체 목록</a>
            </th:block>
            <th:block th:unless="${filtered}">표시할 음식이 없습니다.</th:block>
        </div>
    </div>

    <nav class="pagination" th:if="${foodPage.totalPages > 1}"
         th:with="winStart=${T(java.lang.Math).max(1, T(java.lang.Math).min(foodPage.page - 4, foodPage.totalPages - 9))},
                  winEnd=${T(java.lang.Math).min(foodPage.totalPages, winStart + 9)}">
        <a class="page-btn page-arrow" th:if="${foodPage.hasPrev}" th:href="@{/admin/foods/list(page=${foodPage.page - 1}, q=${foodPage.query}, status=${foodPage.status})}">&lsaquo;</a>
        <a class="page-num" th:each="p : ${#numbers.sequence(winStart, winEnd)}"
           th:classappend="${p == foodPage.page} ? 'page-num-active'"
           th:href="@{/admin/foods/list(page=${p}, q=${foodPage.query}, status=${foodPage.status})}"
           th:text="${p}">1</a>
        <a class="page-btn page-arrow" th:if="${foodPage.hasNext}" th:href="@{/admin/foods/list(page=${foodPage.page + 1}, q=${foodPage.query}, status=${foodPage.status})}">&rsaquo;</a>
    </nav>

    <dialog class="food-modal" th:if="${foodDetail != null}"
            th:data-close="@{/admin/foods/list(page=${foodPage.page}, q=${foodPage.query}, status=${foodPage.status})}">
        <div class="food-modal-head">
            <h2 class="section-title" th:text="|음식 상세 · #${foodDetail.id}|">음식 상세</h2>
            <a class="food-modal-close"
               th:href="@{/admin/foods/list(page=${foodPage.page}, q=${foodPage.query}, status=${foodPage.status})}">✕</a>
        </div>

        <div class="food-modal-body">
                <div class="banner banner-error" th:if="${param.error != null}"
                     th:with="code=${param.error[0]}"
                     th:text="${code == 'invalid-json'} ? '번역/성분 JSON 형식이 잘못됐습니다'
                            : (${code == 'duplicate-name'} ? '이미 같은 이름의 음식이 있습니다'
                            : (${code == 'invalid-name'} ? '이름은 비울 수 없습니다'
                            : (${code == 'stale'} ? '다른 사람이 먼저 수정했습니다 — 상세를 다시 열어 최신 내용으로 편집하세요'
                            : (${code == 'invalid-content'} ? '콘텐츠 검증에 실패했습니다 — 설명 1~255자, 맵기 0~10, 번역 9개 언어, 재료 코드는 카탈로그 코드·비율 1~100'
                            : (${code == 'reason-required'} ? '반려 사유를 입력하세요'
                            : (${code == 'transition'} ? '현재 상태에서 허용되지 않는 조작입니다(재료·이미지가 없으면 승인할 수 없습니다)'
                            : '처리 중 오류가 발생했습니다'))))))"></div>
                <div class="banner banner-info" th:if="${param.reviewed != null}">검수 결과가 반영됐습니다</div>

                <div class="banner banner-warn" th:if="${foodDetail.contentFailureKind != null}">
                    <strong th:text="|수집 실패 · ${foodDetail.contentFailureKind}|">수집 실패</strong>
                    <span th:text="${foodDetail.contentFailureKind.name() == 'NOT_FOOD'} ? '음식이 아니거나 이름을 읽을 수 없습니다 — 이름을 고쳐 재수집하거나 삭제하세요'
                                 : (${foodDetail.contentFailureKind.name() == 'INGREDIENT_GUARD'} ? '재료 판정이 임계값에 못 미쳤습니다 — 안전 직결이라 사람이 재료를 확인해야 합니다'
                                 : '설명·번역 품질이 판정을 통과하지 못했습니다')"></span>
                    <p th:if="${foodDetail.contentReviewRejectionReason != null}"
                       th:text="${foodDetail.contentReviewRejectionReason}"></p>
                </div>

                <div class="field">
                    <label>이미지</label>
                    <img class="food-detail-image" th:if="${foodDetail.imageUrl != null}"
                         th:src="${foodDetail.imageUrl}" alt="음식 이미지"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
                    <div class="image-placeholder" th:style="${foodDetail.imageUrl != null} ? 'display:none'">이미지 없음</div>
                </div>

                <form th:action="@{|/admin/foods/${foodDetail.id}|}" method="post">
                    <input type="hidden" name="page" th:value="${foodPage.page}">
                    <input type="hidden" name="q" th:value="${foodPage.query}">
                    <input type="hidden" name="status" th:value="${foodPage.status}">
                    <input type="hidden" name="version" th:value="${foodDetail.version}">
                    <div class="modal-grid">
                        <div class="field">
                            <label for="koreanName">한국어 이름</label>
                            <input id="koreanName" name="koreanName" type="text" th:value="${foodDetail.koreanName}"
                                   th:disabled="${!editMode}" required>
                        </div>
                        <div class="field">
                            <label for="contentStatus">콘텐츠 상태 (승인·반려·전이로만 변경)</label>
                            <input id="contentStatus" type="text" class="field-select"
                                   th:value="|${foodDetail.contentStatus.displayName} (${foodDetail.contentStatus})|" disabled>
                        </div>
                        <div class="field">
                            <label for="spiciness">맵기 (0~10, -1 = 미조사)</label>
                            <input id="spiciness" name="spiciness" type="number" min="-1" max="10" th:value="${foodDetail.spiciness}"
                                   th:disabled="${!editMode}" required>
                        </div>
                        <div class="field">
                            <label for="imageRef">이미지 키 (비우면 없음)</label>
                            <input id="imageRef" name="imageRef" type="text" th:value="${foodDetail.imageRef}" th:disabled="${!editMode}">
                        </div>
                    </div>
                    <div class="field">
                        <label for="description">설명</label>
                        <textarea id="description" name="description" class="text-input" rows="3"
                                  th:disabled="${!editMode}" th:text="${foodDetail.description}" required></textarea>
                    </div>
                    <div class="field">
                        <label for="nameTranslationsJson">이름 번역 JSON</label>
                        <textarea id="nameTranslationsJson" name="nameTranslationsJson" class="json-input" rows="6"
                                  th:disabled="${!editMode}" th:text="${foodDetail.nameTranslationsJson}"></textarea>
                    </div>
                    <div class="field">
                        <label for="descriptionTranslationsJson">설명 번역 JSON</label>
                        <textarea id="descriptionTranslationsJson" name="descriptionTranslationsJson" class="json-input" rows="6"
                                  th:disabled="${!editMode}" th:text="${foodDetail.descriptionTranslationsJson}"></textarea>
                    </div>
                    <div class="field">
                        <label for="ingredientsJson">재료 JSON (비우면 미조사)</label>
                        <textarea id="ingredientsJson" name="ingredientsJson" class="json-input" rows="6"
                                  th:disabled="${!editMode}" th:text="${foodDetail.ingredientsJson}"></textarea>
                    </div>
                    <div class="modal-foot">
                        <span class="page-info"
                              th:text="|version ${foodDetail.version} · 생성 ${#temporals.format(foodDetail.createdAt, 'yyyy-MM-dd')} · 수정 ${#temporals.format(foodDetail.updatedAt, 'yyyy-MM-dd HH:mm')}|"></span>
                        <a class="btn btn-neutral" th:unless="${editMode}"
                           th:href="@{/admin/foods/list(page=${foodPage.page}, q=${foodPage.query}, status=${foodPage.status}, detail=${foodDetail.id}, edit=true)}">편집</a>
                        <a class="btn btn-neutral" th:if="${editMode}"
                           th:href="@{/admin/foods/list(page=${foodPage.page}, q=${foodPage.query}, status=${foodPage.status}, detail=${foodDetail.id})}">취소</a>
                        <button class="btn btn-primary" type="submit" th:if="${editMode}">저장</button>
                    </div>
                </form>

                <div class="field" th:if="${!editMode and foodDetail.contentStatus.name() == 'PENDING_REVIEW'}">
                    <label>검수</label>
                    <form th:action="@{|/admin/foods/${foodDetail.id}/approve|}" method="post" style="display:inline">
                        <input type="hidden" name="page" th:value="${foodPage.page}">
                        <input type="hidden" name="q" th:value="${foodPage.query}">
                        <input type="hidden" name="status" th:value="${foodPage.status}">
                        <button class="btn btn-primary" type="submit">승인</button>
                    </form>
                    <form th:action="@{|/admin/foods/${foodDetail.id}/reject|}" method="post" style="display:inline">
                        <input type="hidden" name="page" th:value="${foodPage.page}">
                        <input type="hidden" name="q" th:value="${foodPage.query}">
                        <input type="hidden" name="status" th:value="${foodPage.status}">
                        <input name="reason" type="text" class="text-input" placeholder="반려 사유(필수)" required>
                        <button class="btn btn-danger" type="submit">반려</button>
                    </form>
                </div>

                <div class="field" th:unless="${editMode}">
                    <p class="page-info">삭제된 음식의 이름은 계속 점유되어, 같은 이름을 다시 시드하면 등록이 누락됩니다.</p>
                    <form th:action="@{|/admin/foods/${foodDetail.id}/delete|}" method="post"
                          onsubmit="return confirm('이 음식을 삭제할까요? 삭제된 이름은 계속 점유되어 같은 이름을 다시 시드하면 등록이 누락됩니다.')">
                        <input type="hidden" name="page" th:value="${foodPage.page}">
                        <input type="hidden" name="q" th:value="${foodPage.query}">
                    <input type="hidden" name="status" th:value="${foodPage.status}">
                        <button class="btn btn-danger" type="submit">삭제</button>
                    </form>
                </div>
        </div>
    </dialog>

    <script>
        (function () {
            var viewport = document.querySelector('.food-grid-viewport');
            var KEY = 'admin-food-grid-scroll';
            if (viewport) {
                viewport.scrollTop = sessionStorage.getItem(KEY) || 0;
                viewport.addEventListener('scroll', function () {
                    sessionStorage.setItem(KEY, viewport.scrollTop);
                });
            }
            var modal = document.querySelector('.food-modal');
            if (modal) {
                modal.showModal();
                modal.addEventListener('cancel', function (e) {
                    e.preventDefault();
                    location.href = modal.dataset.close;
                });
            }
        })();
    </script>
</section>
</body>
</html>
