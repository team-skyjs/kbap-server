<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>로그인 · K-Bap Admin</title>
    <link rel="stylesheet" th:href="@{/assets/admin.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-brand">
        <div class="brand-name">K-Bap</div>
        <div class="brand-sub">Admin Console</div>
    </div>
    <div class="login-error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/admin/login}" method="post">
        <div class="field">
            <label for="id">아이디</label>
            <input id="id" name="id" type="text" autocomplete="username" autofocus required>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">로그인</button>
    </form>
</div>
</body>
</html>
