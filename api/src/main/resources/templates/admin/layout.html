<!DOCTYPE html>
<html lang="ko" th:fragment="shell(title, active, content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · K-Bap Admin|">K-Bap Admin</title>
    <link rel="stylesheet" th:href="@{/assets/admin.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-name">K-Bap</div>
            <div class="brand-sub">Admin Console</div>
        </div>
        <nav class="nav">
            <div class="nav-group">음식 데이터</div>
            <a class="nav-link" th:href="@{/admin/foods}"
               th:classappend="${active == 'foods'} ? 'is-active'">적재 현황</a>
            <a class="nav-link" th:href="@{/admin/foods/seed}"
               th:classappend="${active == 'seed'} ? 'is-active'">음식 등록</a>
            <a class="nav-link" th:href="@{/admin/foods/images}"
               th:classappend="${active == 'images'} ? 'is-active'">이미지 배치</a>
            <div class="nav-group">회원</div>
            <a class="nav-link" th:href="@{/admin/members}"
               th:classappend="${active == 'members'} ? 'is-active'">회원 관리</a>
        </nav>
        <form class="logout" th:action="@{/admin/logout}" method="post">
            <button type="submit">로그아웃</button>
        </form>
    </aside>
    <main class="content" th:insert="${content}"></main>
</div>
</body>
</html>
