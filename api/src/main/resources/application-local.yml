spring:
  # 로컬 개발 중 템플릿 수정이 재시작 없이 반영되도록 캐시 끔(운영은 기본 on 유지)
  thymeleaf:
    cache: false
  # 로컬은 자동 적용을 유지한다 — 수동 적용은 배포 환경(dev·staging·prod)만 해당한다(KB-446).
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  # 로컬은 환경변수로 덮어쓸 수 있게 하되, 없으면 localhost 기본값으로 바로 뜬다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kbap}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # 로컬 docker Redis 는 평문 — TLS 로 검증하려면 REDIS_SSL_ENABLED=true (KB-169)
        enabled: ${REDIS_SSL_ENABLED:false}
