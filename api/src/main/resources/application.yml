logging:
  # Boot 기본 콘솔 패턴의 correlation 자리에 삽입된다 — logback-spring.xml 수정 없이
  # 전 로그 라인에 요청 상관 키·회원 식별자가 붙는다(값이 없으면 빈 칸). (KB-130)
  pattern:
    correlation: "[reqId=%X{requestId:-}][memberId=%X{memberId:-}] "

server:
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰한다.
  # 프록시가 TLS 를 종료(https)하고 평문 http 로 넘겨도 앱이 원래 스킴/호스트를 인식해
  # Swagger UI 등 자기 참조 URL 을 https 로 생성한다(mixed content 방지).
  forward-headers-strategy: framework

spring:
  # 루트의 .env 를 properties 형식으로 읽어 ${...} 플레이스홀더에 사용한다.
  # optional: → .env 가 없으면(예: 배포 환경) 조용히 건너뛰고 OS 환경변수를 쓴다.
  # (.env 를 루트에서 찾도록 kbap-api 의 bootRun workingDir 를 루트로 설정해 둠)
  config:
    import: optional:file:.env[.properties]
  application:
    name: kbap-api
  flyway:
    # 신규 마이그레이션 버전은 생성 시각 기반 점 구분 timestamp(Vyyyy.MM.dd.HH.mm.ss)라,
    # 먼저 만들고 늦게 머지된 마이그레이션이 이미 적용된 최신보다 과거 버전이 될 수 있다.
    # 이를 validate 실패(부팅 거부)가 아니라 정상 적용(out-of-order)으로 허용한다.
    # 전제: 각 마이그레이션은 실행 순서에 의존하지 않게 독립적으로 작성한다. (KB-44)
    out-of-order: true
  # 활성 프로필은 런타임에 지정한다 (예: SPRING_PROFILES_ACTIVE=local|dev|staging|prod).
  # 여기서 기본 프로필이나 datasource 를 강제하지 않는다 — 프로필 없이 뜨는 테스트(@SpringBootTest)는
  # test resources 의 application.yml 오버라이드 + MySQL Testcontainers(@ServiceConnection)로 동작한다.
  ai:
    model:
      # LLM 모델은 구현 시 빈으로 명시 구성한다(OpenAI 단일 벤더).
      # 키 없이 자동구성이 떠서 부팅이 실패하지 않도록 기본은 모두 비활성으로 둔다.
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

kbap:
  scan:
    # 스캔 예약(무료 슬롯 선점)의 TTL — LLM 최대 타임아웃보다 충분히 길게. 프로세스가 죽어 해제를 못 해도 만료로 슬롯이 복구된다.
    reservation-ttl-seconds: ${SCAN_RESERVATION_TTL_SECONDS:300}
    # 스캔 티켓(발급형 자격 증명)의 유효 시간 — 발급~스캔 호출 사이(사진 촬영·업로드)를 감당할 만큼.
    ticket-ttl-seconds: ${SCAN_TICKET_TTL_SECONDS:300}
  auth:
    firebase:
      # 서비스 계정 키를 주는 방법은 두 가지이며 json 이 우선한다.
      #  1) credentials-json — 키 파일 내용(base64 권장). 파일을 두지 않아도 되므로 머신·컨테이너·CI 어디서나 동일하다.
      #  2) credentials-path — 키 파일 경로. 파일 마운트를 쓰는 배포 환경용.
      # 둘 다 없으면 항상 거절하는 폴백 검증기가 등록되어 부팅은 정상이고 /api/auth/login 만 401 이다.
      # 키는 저장소에 커밋하지 않는다 — 주입 경로는 .env.example / specs/kb-118-firebase-jwt-auth/quickstart.md.
      credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    jwt:
      # HS256 서명 키. 32바이트 이상(HMAC-SHA256 최소 길이) — 미설정 시 부팅 실패로 조용한 약한 키를 막는다.
      secret: ${JWT_SECRET:}
      # access 는 stateless 라 만료 전 무효화가 불가능하므로 짧게, refresh 는 Redis 폐기가 가능하므로 길게.
      access-ttl: 30m
      refresh-ttl: 14d
  llm:
    # 메뉴판 사진 스캔(KB-138)은 vision 모델을 단일 호출한다. 스캔은 필수 기능이라 끄는 스위치를 두지 않는다 —
    # ScanService 가 이 빈에 의존하므로 OPENAI_API_KEY 가 없으면 부팅 시 알려주며 실패한다.
    # (enabled 프로퍼티 자체는 남긴다 — batch·테스트는 이 설정을 안 읽어 vision 빈을 올리지 않는다.)
    # image-base-url 은 업로드 이미지의 공개 CDN 베이스와 같은 값이라 kbap.storage.public-base-url 을 그대로 쓴다.
    # 모델이 그 도메인 + 오브젝트 path 로 사진을 직접 fetch 한다(DB 엔 path 만 저장).
    # KB-320: gpt-4o-mini -> gpt-5.6-luna. 추론 모델이라 기본값 외 temperature 를 거부할 수 있어 기본값 1.0 을 보낸다
    # (온도 0 의 결정적 판정은 추론 모델에서 어차피 보장되지 않는다). 출력 토큰에 추론 토큰이 포함돼 비용이 늘어난다.
    vision:
      enabled: true
      api-key: ${OPENAI_API_KEY:}
      model: gpt-5.6-luna
      image-base-url: ${kbap.storage.public-base-url}
      temperature: 1.0
      max-retries: 0
      pricing:
        input-usd-per-million-tokens: 0.2
        output-usd-per-million-tokens: 1.2
    # 음식 이미지 배치 생성(KB-226): OpenAI Batch API 일괄 제출 + 3시간 주기(하루 8회) 폴링 회수. 빈 조립은 무조건이고
    # 키 검증은 첫 호출 시점 — 키 없이는 관리자 제출·회수만 실패하고 부팅은 성공한다.
    # pricing 은 Batch 단가(동기 대비 50% 할인가)를 넣는다 — 회수 시 장당 llm_call_cost 1행 기록.
    image:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-image-2
      size: 1024x1024
      quality: medium
      output-format: webp
      output-compression: 80
      pricing:
        input-usd-per-million-tokens: 2.5
        output-usd-per-million-tokens: 20.0
    # 스캔 v2 유사 폴백(KB-319)의 검색 질의 임베딩 — OpenAI text-embedding-3-small, 저장측과 256차원 고정(KB-328 전환).
    # 기본 off — 미활성이면 유사 폴백만 조용히 생략되고 스캔은 정상 동작한다(부분 성공).
    embedding:
      enabled: ${EMBEDDING_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: text-embedding-3-small
      dimension: 256
  # 스캔 v2 유사 음식 벡터 검색(KB-319) — DocumentDB(MongoDB 호환). 기본 off(로컬 등 클러스터 없는 환경 부팅 안전).
  # 문서·검색 계약: specs/kb-319-scan-ocr-vector-fallback/contracts/vector-food-document.md
  vector:
    enabled: ${VECTOR_ENABLED:false}
    # TLS·CA 번들 포함 연결 문자열 — 시크릿이므로 환경 변수로만 주입한다.
    uri: ${VECTOR_DB_URI:}
    database: ${VECTOR_DB_DATABASE:kbap}
    collection: ${VECTOR_DB_COLLECTION:foods}
  # 이미지 배치 운영 파라미터(KB-226). 배치당 100건 — 한 번에 제작해 한 번에 회수(운영 결정).
  # 배치 단위 실패/만료의 손실을 줄이기 위해 회수는 failed/expired 배치의 부분 완료분도 거둬들인다.
  # 프롬프트는 설정이 아니라 코드 상수(FoodImageProperties.PROMPT_TEMPLATE) — 변경 시 PROMPT_VERSION 도 함께 올린다.
  # 리뷰 작성 화면의 식당 검색(KB-274). 서버가 카카오 로컬 검색을 대신 호출해 REST 키를 클라이언트에 노출하지 않는다.
  # 키가 없어도 부팅은 정상이고 GET /api/v1/places 만 PLACE-001(502) 로 실패한다 — 리뷰 작성은 식당 없이 계속 가능.
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  food-image:
    batch-size: 100
    # 3시간 주기 cron(하루 8회) — 전 인스턴스가 같은 순간 깨어나 ShedLock 이 1대만 고른다(주기당 정확히 1회).
  # 이미지 스토리지 S3(KB-138 완료검증 head/delete + KB-145 presigned 발급). enabled=true 프로파일에서만
  # 실 S3 빈(StorageObjectStore·PresignedUploadPort)을 조립한다 — 기본 on, 자격증명은 DefaultCredentialsProvider.
  # public-base-url 은 저장·표시용 공개(CDN) 베이스(presigned 발급 응답의 publicUrl).
  storage:
    enabled: ${STORAGE_ENABLED:true}
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:ap-northeast-2}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:}
    # 공유 버킷 환경별 폴더 접두 — 업로드 API 발급 키에만 적용, 음식 사진(images/food)은 환경 공용이라 무접두(KB-171·KB-243).
    key-prefix: ${STORAGE_KEY_PREFIX:local}
  upload:
    # presigned 발급 정책 — 허용 이미지 형식·크기 상한(bytes)·업로드 URL 만료(KB-145).
    allowed-content-types: image/jpeg,image/png,image/webp
    max-bytes: 10485760
    upload-ttl: 5m
