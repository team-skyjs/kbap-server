logging:
  # 수집기가 requestId·memberId·status·elapsedMs 를 필드 단위로 검색할 수 있게 JSON 으로 출력한다.
  # Boot 내장 structured logging — MDC 값이 최상위 필드로 자동 포함된다. (KB-130)
  structured:
    format:
      console: ecs
  level:
    # 홈 화면 쿼리별 소요 시간·호출 수 측정용 — 측정 끝나면 generate_statistics 와 함께 되돌린다 (KB-715).
    # Hibernate 7.4 로거: 쿼리별 time/rows 는 org.hibernate.statistics, 세션당 JDBC 호출 수·시간 요약은
    # org.hibernate.session.metrics (DEBUG 이면 세션 리스너가 등록된다). 구 org.hibernate.stat 는 더 이상 쓰지 않는다.
    org.hibernate.statistics: DEBUG
    org.hibernate.session.metrics: DEBUG

spring:
  # Tomcat 요청 처리를 버추얼 스레드로 — 스레드 풀 상한(200)이 동시 처리를 막지 않는다 (KB-653, dev 만 먼저).
  # RDS max_connections 가 60 이라 Hikari 풀(10)은 그대로 둔다 — 병목이 DB 로 옮겨가는지 재측정이 목적.
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      # 쿼리마다 실행 시간·행 수, 세션당 JDBC 호출 수를 로그로 남긴다 — 임시 측정 (KB-715).
      hibernate.generate_statistics: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        # 전송 중 암호화 필수 Redis(ElastiCache) 대응 — 평문 예외 환경은 REDIS_SSL_ENABLED=false (KB-169)
        enabled: ${REDIS_SSL_ENABLED:true}

kbap:
  storage:
    # 실 S3 버킷·공개(CDN) 베이스. bucket 이 있어야 실 발급 어댑터가 조립된다(KB-145).
    bucket: ${STORAGE_BUCKET}
    public-base-url: ${IMAGE_PUBLIC_BASE_URL}
    # 공유 버킷 환경 접두 — 기본 dev, env 로 커밋 없이 변경 가능(KB-171).
    key-prefix: ${STORAGE_KEY_PREFIX:dev}
