hooks:
  before_specify:
  - extension: git
    command: speckit.git.branch
    optional: false
    description: feature 브랜치를 생성하고 전환한 뒤 명세를 작성한다
    prompt: create-new-feature.sh 로 feature 브랜치를 생성·전환하고 BRANCH_NAME/SPEC_FILE/FEATURE_NUM
      을 반환한다.
installed:
- assess
settings:
  auto_execute_hooks: true
